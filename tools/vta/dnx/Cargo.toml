# Standalone VTA differential harness for card 6.VTA-filmcraft-dnx.
# NOT a workspace member (root members = crates/*, apps/*, tools/xtask) —
# the empty [workspace] table below pins it to its own workspace root.
# Build off the shared target dir: CARGO_TARGET_DIR=/tmp/vta-dnx-target cargo run --release -- ...
[workspace]

[package]
name = "vta-dnx"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Proposed admission pin: exact version, default-features OFF (drops the
# `threads` feature and with it rayon; single-threaded decode path is what
# we measure — DecodeOptions { threads: false } is the no-rayon path).
filmcraft-dnx = { version = "=0.9.0", default-features = false }
