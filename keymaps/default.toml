[navigation]
# Jump sizes: VLC 3.0.23 binary-observed defaults (#extrashort-jump-size=3,
# #short-jump-size=10, #medium-jump-size=60, #long-jump-size=300 seconds) —
# identical to the design package Settings - controls.svg skip amounts
# (Very short 3 s / Short 10 s / Medium 60 s / Long 300 s).
jump-size-extrashort-ms = 3000
jump-size-short-ms = 10000
jump-size-medium-ms = 60000
jump-size-long-ms = 300000

toggle-play-pause = { key = "Space", label-msgid = "hotkeys.play-pause", command = "playback.toggle-play-pause", mode = "player-focused", when = "has-media", source = "design-package", note = "Keyboard Shortcuts.svg 'Play / pause — Space'; identical to VLC key-play-pause" }
stop = { key = "S", label-msgid = "hotkeys.stop", command = "playback.stop", mode = "player-focused", when = "has-media", source = "design-package", note = "Keyboard Shortcuts.svg 'Stop playback — S'; identical to VLC key-stop" }

# Design specifies BOTH N/P (Keyboard Shortcuts.svg) and </> (Onboarding-2.svg)
# for next/previous — design-internal inconsistency D-2; both kept (lossless,
# and N/P is also the VLC default). See ui-inventory.md §7.
next-track = { key = "N", label-msgid = "hotkeys.next-track", command = "playlist.next", mode = "player-focused", source = "design-package", note = "Keyboard Shortcuts.svg 'Next track — N'; identical to VLC key-next" }
prev-track = { key = "P", label-msgid = "hotkeys.prev-track", command = "playlist.prev", mode = "player-focused", source = "design-package", note = "Keyboard Shortcuts.svg 'Previous track — P'; identical to VLC key-prev" }
next-item = { key = ">", label-msgid = "hotkeys.next-item", command = "playlist.next", mode = "player-focused", source = "design-package", note = "Onboarding-2 'Next Item — >' (glyph key, layout-translated at runtime)" }
prev-item = { key = "<", label-msgid = "hotkeys.prev-item", command = "playlist.prev", mode = "player-focused", source = "design-package", note = "Onboarding-2 'Previous Item — <'" }

frame-next = { key = ".", label-msgid = "hotkeys.frame-next", command = "playback.step-frame", args = { direction = "next" }, mode = "player-focused", when = "has-media", source = "design-package", note = "Onboarding-2 'Next Frame — .' (design adds a second frame-step key; VLC default is e, superseded)" }
frame-prev = { key = ",", label-msgid = "hotkeys.frame-prev", command = "playback.step-frame", args = { direction = "previous" }, mode = "player-focused", when = "has-media", source = "design-package", note = "Onboarding-2 'Previous Frame — ,' — NEW capability: VLC 3.0.23 has no frame-previous hotkey (doc 05 §2.4 supplies the command)" }

# Bare-arrow seek is a DESIGN override (Onboarding-2 'Seek Backward / Forward —
# ← / →'); VLC 3.0.23 default leaves bare arrows to disc-menu navigation
# (key-nav-*). Duration comes from the VLC short jump (10 s) since the design
# does not specify an amount — resolution R-C1, ui-inventory.md §7.
seek-backward = { key = "Left", label-msgid = "hotkeys.seek-backward", command = "playback.seek", args = { target = { kind = "relative", delta_ms = -10000 } }, mode = "player-focused", when = "has-media", source = "design-package", note = "CONFLICT C-01: VLC default arrows = disc-menu nav; design = seek. Disc-menu nav gated by in-disc-menu condition [PROPOSAL new token, Q4]" }
seek-forward = { key = "Right", label-msgid = "hotkeys.seek-forward", command = "playback.seek", args = { target = { kind = "relative", delta_ms = 10000 } }, mode = "player-focused", when = "has-media", source = "design-package", note = "C-01 as above" }
seek-backward-extrashort = { key = "Shift+Left", label-msgid = "hotkeys.seek-backward-extrashort", command = "playback.seek", args = { target = { kind = "relative", delta_ms = -3000 } }, mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "key-jump-extrashort=Shift+Left (3 s). QtHotkeys wiki says '5 seconds' — stale; binary wins (D-3)" }
seek-forward-extrashort = { key = "Shift+Right", label-msgid = "hotkeys.seek-forward-extrashort", command = "playback.seek", args = { target = { kind = "relative", delta_ms = 3000 } }, mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "key-jump+extrashort=Shift+Right" }
seek-backward-medium = { key = "Ctrl+Left", label-msgid = "hotkeys.seek-backward-medium", command = "playback.seek", args = { target = { kind = "relative", delta_ms = -60000 } }, mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "key-jump-medium=Ctrl+Left (60 s)" }
seek-forward-medium = { key = "Ctrl+Right", label-msgid = "hotkeys.seek-forward-medium", command = "playback.seek", args = { target = { kind = "relative", delta_ms = 60000 } }, mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "key-jump+medium=Ctrl+Right" }
seek-backward-long = { key = "Ctrl+Alt+Left", label-msgid = "hotkeys.seek-backward-long", command = "playback.seek", args = { target = { kind = "relative", delta_ms = -300000 } }, mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "key-jump-long=Ctrl+Alt+Left (300 s)" }
seek-forward-long = { key = "Ctrl+Alt+Right", label-msgid = "hotkeys.seek-forward-long", command = "playback.seek", args = { target = { kind = "relative", delta_ms = 300000 } }, mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "key-jump+long=Ctrl+Alt+Right" }

# Rate. VLC 3.0.23: key-faster=+, key-slower=-, key-rate-normal==,
# key-rate-faster-fine=], key-rate-slower-fine=[. Step semantics (VLC
# doubling vs doc 05 §8.2's ±0.25) unresolved — recipes, [VERIFY] Q5.
rate-faster = { key = "+", label-msgid = "hotkeys.rate-faster", recipe = "rate-faster", mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default" }
rate-slower = { key = "-", label-msgid = "hotkeys.rate-slower", recipe = "rate-slower", mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default" }
rate-normal = { key = "=", label-msgid = "hotkeys.rate-normal", command = "playback.set-rate", args = { rate = 1.0 }, mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default" }
rate-faster-fine = { key = "]", label-msgid = "hotkeys.rate-faster-fine", recipe = "rate-faster-fine", mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default" }
rate-slower-fine = { key = "[", label-msgid = "hotkeys.rate-slower-fine", recipe = "rate-slower-fine", mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default" }

show-position = { key = "T", label-msgid = "hotkeys.show-position", ui_action = "toggle-position-display", mode = "player-focused", source = "design-package", note = "Keyboard Shortcuts.svg 'Show playback position and time — T'; identical to VLC key-position=t" }
jump-to-time = { key = "Ctrl+T", label-msgid = "hotkeys.jump-to-time", ui_action = "goto-time", mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "QtHotkeys wiki 'Goto Time Ctrl+T'; dialog → playback.seek" }

chapter-prev = { key = "Shift+P", label-msgid = "hotkeys.chapter-prev", recipe = "chapter-prev", mode = "player-focused", when = "has-chapters", source = "vlc-3.0.23-default", note = "key-chapter-prev=Shift+P; recipe: playback.seek {Chapter: current-1}" }
chapter-next = { key = "Shift+N", label-msgid = "hotkeys.chapter-next", recipe = "chapter-next", mode = "player-focused", when = "has-chapters", source = "vlc-3.0.23-default", note = "key-chapter-next=Shift+N" }
title-prev = { key = "Shift+O", label-msgid = "hotkeys.title-prev", recipe = "title-prev", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-title-prev=Shift+O; no title-level command in doc 05 §2 v1 — recipe/flagged Q6" }
title-next = { key = "Shift+B", label-msgid = "hotkeys.title-next", recipe = "title-next", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-title-next=Shift+B; Q6 as above" }
program-next = { key = "X", label-msgid = "hotkeys.program-next", recipe = "program-sid-next", mode = "player-focused", source = "design-package", note = "Keyboard Shortcuts.svg 'Next program / Service ID — X'; identical to VLC key-program-sid-next=x; no program command in v1 catalog — Q6" }
program-prev = { key = "Shift+X", label-msgid = "hotkeys.program-prev", recipe = "program-sid-prev", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-program-sid-prev=Shift+X; Q6 as above" }
disc-menu = { key = "Shift+M", label-msgid = "hotkeys.disc-menu", recipe = "disc-menu", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-disc-menu=Shift+m; DVD/BD in-menu navigation; v1: feature-gated (disc input)" }

# Disc/BD in-menu navigation (VLC defaults). Bare arrows collide with the
# design's seek/volume bindings — gated by a proposed `in-disc-menu` condition
