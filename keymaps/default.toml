# Lumen Media Player — default keymap seed (v1)
#
# Task 0.B3 (doc 13 §3) — G6 deliverable. Generated 2026-10-19.
# Precedence per decision D-003 (docs/ROADMAP.md §3):
#   VLC 3.0.23 default hotkeys where clean-room-observable,
#   OVERRIDDEN by design/figma/Keyboard Shortcuts.svg (and the other design
#   surfaces that specify keys: Onboarding-2.svg, right-click menu.svg,
#   menu.svg) where they specify a binding.
#
# Sources:
#   vlc-3.0.23-default  = observed on our pinned Linux oracle (Debian trixie
#                         3.0.23-0+deb13u1, docs/baselines/vlc-3.0.23-linux.md):
#                         `vlc -I dummy --reset-config --config <file>` dump of
#                         defaults (all 111 `key-*` entries + 111 empty
#                         `global-key-*`), plus `--longhelp --advanced` for the
#                         option names/descriptions; Qt-menu-level accelerators
#                         (Ctrl+B/Ctrl+E/… not present in the core dump) from
#                         https://wiki.videolan.org/QtHotkeys/ (GPL doc, accessed
#                         2026-10-19).
#   design-package      = design/figma/ text extraction (path-id mining, doc 08
#                         §1.1 method): "Keyboard Shortcuts.svg" (9 rows),
#                         "Onboarding-2.svg" (12 shortcuts), "right-click
#                         menu.svg", "menu.svg".
#
# Full transcription, per-entry provenance discussion, design-vs-VLC conflict
# resolutions and the [VERIFY] ledger: docs/inventory/ui-inventory.md §5–§8.
#
# FORMAT FLAG (for the Lead): doc 05 §8.1 specifies `config/keymaps/default.toml`
# with `[[binding]]` rows (`schema = "keymap.v1"`); this seed follows card 0.B3
# and D-003 (`keymaps/*.toml`, section-grouped `binding-id = { … }` entries with
# `label-msgid`). Reconcile the two before the `schemas/keymap.schema.json`
# validator lands (open question Q1, ui-inventory.md §9). Field semantics
# (`mode`, `when`, `args`, `recipe`) are taken from doc 05 §8.1/§8.2; `when`
# uses only the documented condition tokens (has-media, has-video, fullscreen,
# has-chapters). Entries may carry `command` OR `ui_action` (doc 05 §8.4), never
# both. Menu accelerators reference these binding ids (binding-id indirection,
# doc 05 §8.1) — the menus data file is a later task.
#
# Per-platform: this file is the Linux/Windows-desktop seed (Ctrl = Ctrl).
# macOS rendering rule: menu-style modifiers Ctrl→Cmd (per macOS VLC convention,
# [VERIFY] against a pinned macOS run); additional macOS key differences are in
# [platform_overrides.macos] at the bottom. G6 per-platform notes and
# provenance: ui-inventory.md §5.4.

# ==============================================================================
[media]
# Media open / session lifecycle. Design accelerators from menu.svg agree with
# the QtHotkeys wiki values for every item the two share.

open-file = { key = "Ctrl+O", label-msgid = "hotkeys.open-file", ui_action = "open-file", mode = "player-focused", source = "design-package", note = "menu.svg 'Open File(s) Ctrl + O'; identical to VLC Qt (QtHotkeys wiki Ctrl+O)" }
open-folder = { key = "Ctrl+F", label-msgid = "hotkeys.open-folder", ui_action = "open-folder", mode = "player-focused", source = "design-package", note = "menu.svg; identical to VLC Qt Ctrl+F 'Open Folder/Directory'" }
open-network-stream = { key = "Ctrl+N", label-msgid = "hotkeys.open-network-stream", ui_action = "open-network-stream", mode = "player-focused", source = "design-package", note = "menu.svg; identical to VLC Qt Ctrl+N" }
open-disc = { key = "Ctrl+D", label-msgid = "hotkeys.open-disc", ui_action = "open-disc", mode = "player-focused", source = "design-package", note = "menu.svg; identical to VLC Qt Ctrl+D. v1: SourceSpec::Disc is future/feature-gated (doc 05 §2.2) — binding ships disabled-from-data" }
open-capture-device = { key = "Ctrl+C", label-msgid = "hotkeys.open-capture-device", ui_action = "open-capture-device", mode = "player-focused", source = "design-package", note = "menu.svg; identical to VLC Qt Ctrl+C. CONFLICT C-07: collides with platform copy convention — accepted per D-003 (design wins); revisit with design owner. v1: feature-gated" }
open-location-clipboard = { key = "Ctrl+V", label-msgid = "hotkeys.open-location-clipboard", ui_action = "open-location-clipboard", mode = "player-focused", source = "vlc-3.0.23-default", note = "QtHotkeys wiki 'Paste Location/Paste MRL Ctrl+V'; not shown in design menu.svg — VLC fill" }
convert = { key = "Ctrl+R", label-msgid = "hotkeys.convert", ui_action = "convert", mode = "player-focused", source = "design-package", note = "menu.svg 'Convert'; VLC Qt 'Convert/Save Ctrl+R'. Disposition not-adopted-v1 (no transcode in v1 catalog) — binding kept as data" }
quit = { key = "Ctrl+Q", label-msgid = "hotkeys.quit", ui_action = "quit", mode = "always", source = "design-package", note = "right-click menu.svg 'Quit VLC Ctrl + Q'; identical to VLC key-quit=Ctrl+q (binary-observed). macOS: Cmd+Q (platform rule)" }

# Hardware / browser media keys (VLC 3.0.23 defaults; multi-binding options
# written by the oracle as tab-separated alternates — split into one entry each).
media-key-play-pause = { key = "MediaPlayPause", label-msgid = "hotkeys.play-pause", command = "playback.toggle-play-pause", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-play-pause = Space + 'Media Play Pause'" }
media-key-next = { key = "MediaNext", label-msgid = "hotkeys.next-track", command = "playlist.next", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-next = n + 'Media Next Track'" }
media-key-prev = { key = "MediaPrev", label-msgid = "hotkeys.prev-track", command = "playlist.prev", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-prev = p + 'Media Prev Track'" }
media-key-stop = { key = "MediaStop", label-msgid = "hotkeys.stop", command = "playback.stop", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-stop = s + 'Media Stop'" }
media-key-volume-up = { key = "VolumeUp", label-msgid = "hotkeys.volume-up", recipe = "volume-up", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-vol-up = Ctrl+Up + 'Volume Up'; recipe: audio.set-volume +5% client-side" }
media-key-volume-down = { key = "VolumeDown", label-msgid = "hotkeys.volume-down", recipe = "volume-down", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-vol-down = Ctrl+Down + 'Volume Down'" }
media-key-mute = { key = "VolumeMute", label-msgid = "hotkeys.mute", recipe = "mute-toggle", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-vol-mute = m + 'Volume Mute'" }
media-key-frame-next = { key = "BrowserNext", label-msgid = "hotkeys.frame-next", command = "playback.step-frame", args = { direction = "next" }, mode = "player-focused", source = "vlc-3.0.23-default", note = "key-frame-next = e + 'Browser Next' (X11 keysym); VLC 3.0.23 has NO frame-previous action" }
browser-refresh-play = { key = "BrowserRefresh", label-msgid = "hotkeys.play", command = "playback.play", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-play = 'Browser Refresh'" }
browser-stop-pause = { key = "BrowserStop", label-msgid = "hotkeys.pause", command = "playback.pause", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-pause = 'Browser Stop'" }

