nav-activate = { key = "Enter", label-msgid = "hotkeys.nav-activate", ui_action = "nav-activate", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-nav-activate=Enter" }
nav-up = { key = "Up", label-msgid = "hotkeys.nav-up", ui_action = "nav-up", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-nav-up=Up; needs in-disc-menu gating (Q4) — conflicts with design volume-up" }
nav-down = { key = "Down", label-msgid = "hotkeys.nav-down", ui_action = "nav-down", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-nav-down=Down; Q4 as above" }
nav-left = { key = "Left", label-msgid = "hotkeys.nav-left", ui_action = "nav-left", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-nav-left=Left; Q4 — conflicts with design seek-backward" }
nav-right = { key = "Right", label-msgid = "hotkeys.nav-right", ui_action = "nav-right", mode = "player-focused", source = "vlc-3.0.23-default", note = "key-nav-right=Right; Q4 — conflicts with design seek-forward" }

