# ==============================================================================
[platform_overrides.macos]
# macOS key differences. Sources: https://wiki.videolan.org/Mac_OS_X/ (accessed
# 2026-10-19) — page documents an OLDER macOS VLC (0.8.6a / 3.0.12-era text);
# every entry here is [VERIFY] against a pinned macOS 3.0.23 run (hardware,
# docs/baselines/hardware-template.md §4). Modifier rule: menu-style Ctrl
# bindings render as Cmd on macOS (Cmd+O, Cmd+P, Cmd+Q, …).
fullscreen-macos = { key = "Cmd+F", label-msgid = "hotkeys.fullscreen", recipe = "fullscreen-toggle", mode = "player-focused", source = "vlc-3.0.23-default", note = "[VERIFY] macOS wiki: '⌘+F toggle fullscreen (Escape will also exit)'; Linux uses F" }
seek-backward-medium-macos = { key = "Cmd+Shift+Left", label-msgid = "hotkeys.seek-backward-medium", command = "playback.seek", args = { target = { kind = "relative", delta_ms = -60000 } }, mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "[VERIFY] macOS wiki: '⌘+Shift+left/right — jump about a minute'; differs from Linux Ctrl+Left/Right" }
seek-forward-medium-macos = { key = "Cmd+Shift+Right", label-msgid = "hotkeys.seek-forward-medium", command = "playback.seek", args = { target = { kind = "relative", delta_ms = 60000 } }, mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "[VERIFY] as above" }
seek-backward-short-macos = { key = "Cmd+Ctrl+Left", label-msgid = "hotkeys.seek-backward-short", command = "playback.seek", args = { target = { kind = "relative", delta_ms = -10000 } }, mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "[VERIFY] macOS wiki: '⌘+Ctrl+left/right — jump about ten seconds'; Linux short jump is Alt+Left/Right — modifier mapping differs per platform" }
seek-forward-short-macos = { key = "Cmd+Ctrl+Right", label-msgid = "hotkeys.seek-forward-short", command = "playback.seek", args = { target = { kind = "relative", delta_ms = 10000 } }, mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "[VERIFY] as above" }
audio-delay-down-macos = { key = "F", label-msgid = "hotkeys.audio-delay-down", recipe = "audio-delay-down", mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "[VERIFY] macOS wiki: 'F – Decrease Audio Delay; G – Increase'; Linux uses J/K — NOTE: F is also design fullscreen; needs platform gating, flagged Q8" }
audio-delay-up-macos = { key = "G", label-msgid = "hotkeys.audio-delay-up", recipe = "audio-delay-up", mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "[VERIFY] as above" }
subtitle-delay-down-macos = { key = "H", label-msgid = "hotkeys.subtitle-delay-down", recipe = "subtitle-delay-down", mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "[VERIFY] macOS wiki: 'H – Decrease Subtitle Delay; J – Increase'; same keys as Linux subtitle-delay (h/g) but different assignment shape — verify" }
subtitle-delay-up-macos = { key = "J", label-msgid = "hotkeys.subtitle-delay-up", recipe = "subtitle-delay-up", mode = "player-focused", when = "has-media", source = "vlc-3.0.23-default", note = "[VERIFY] as above; J is Linux audio-delay-down — cross-platform key reuse, Q8" }
