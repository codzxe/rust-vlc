name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install the ffmpeg external oracle
      # The differential tests skip loudly without ffmpeg
      # (testkit::oracle_available); installing it makes them run.
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
