# Lumen UI CI — live (proposed by card 4.A1; reconciled + visual lanes added
# by issue #5, 2026-11-09: the UI lane is NOT forked into ci.yml — it lives
# here alone).
#
# Parity target: the ui/ portion of the doc 10 §2 gate parity table that
# ci.yml explicitly defers ("the UI/tauri/wasm steps... land with their
# owning cards"). Local equivalents proven green in the 4.A1 closure
# session (2026-10-23): typecheck, lint (0 errors, 1 accepted
# react-refresh warning), vitest 9/9, Playwright smoke 1/1 on chromium
# 156.0.8078.4.
#
# Design notes (mirrors ci.yml conventions where they apply):
#   * ONE lean ubuntu job per lane — no OS matrix for the compare lane
#     (doc 08 §9.3): visual baselines are per-OS (font rasterization
#     differs) and only the Linux set is committed; macOS/Windows get the
#     non-blocking BASELINE SEED job below.
#   * `if: always()` keep-going aggregation on the ui gate steps, exactly
#     like ci.yml's full_gate.sh replication — one failing step never
#     hides the state of the others.
#   * node 24 (matches the local dev node 24.21.0 recorded in ui/README);
#     npm cache via setup-node, keyed on ui/package-lock.json.
#   * Playwright browsers cached via actions/cache keyed on the lockfile
#     (the 4.A1 header promised this; issue #5 implements it) —
#     `npx playwright install --with-deps chromium` is a fast no-op on hit
#     and self-installs system deps on miss.
#   * HTML reports always uploaded so red runs are debuggable from the
#     run page.
#   * VISUAL LANES (issue #5; counts updated by issue #37, 2026-11-09;
#     re-counted by w26.k20 to 50/216 — MATRIX-20261113.md is the current
#     pin; FX8-A07 2026-11-26 un-gated the full matrix):
#     `visual` = PR-lite lane (1280x720 @1x, dark+light — 25 routes × 2
#     modes = 50 cases; committed Linux baselines re-pinned 2026-11-13:
#     50 passed 1.6m — provenance in e2e/visual/MATRIX-20261113.md).
#     `visual-full` = full matrix (216 cases, doc 08 §6.3) on EVERY
#     push/PR. It was schedule-only (as `visual-nightly`) until FX8-A07
#     (audit finding: a visual regression could ship undetected for up
#     to 24h — the ≤24h window is the honesty gap FIX-PLAN §4 F2.2 closes):
#     the full lane measures 7.1–7.2 minutes compare (MATRIX-20261113.md
#     addenda), well inside the 25-minute timeout, so no subset split is
#     needed — the whole matrix gates every PR.
#     `visual-baseline-seed` = [BLOCKED on first real macOS/Windows run]:
#     macos/windows baselines CANNOT be captured from the Linux sandbox
#     this repo lives in — the job exists, is non-blocking
#     (continue-on-error), runs --update-snapshots to CAPTURE the per-OS
#     baseline set, and uploads it for human review + commit. Until those
#     baselines are committed, any compare-mode run on that OS fails by
#     design (missing baselines) — that is honest, not fake green.
#
# Action pins (re-resolved via `git ls-remote` on 2026-11-09, issue #5;
# no drift vs the 4.A1 table):
#   actions/checkout        v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node      v6.0.0  2028fbc5c25fe9cf00d9f06a71cc4710d4507903
#   actions/cache           v4.3.0  0057852bfaa89a56745cba8c7296529d2fc39830
#   actions/upload-artifact v7.0.2  cf430e030ddbb5b0abf93d22962f4752f3646cd9

name: UI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly 03:41 UTC (off-the-hour). Since FX8-A07 the compare lanes
    # gate every push/PR; the schedule trigger stays to exercise the
    # visual-full matrix once a day on a quiet tree and to feed the
    # macOS/Windows baseline-seed lane below.
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ui

concurrency:
  # One run per branch/PR head (doc 10 §10.1), same shape as ci.yml.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    name: ui (typecheck / lint / l10n / vitest / playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache Playwright browsers (chromium)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - run: npm ci

      # --- gate steps: keep-going aggregation (if: always()) ---------------
      - name: "1. typecheck"
        if: always()
        run: npm run typecheck

      - name: "2. lint"
        if: always()
        run: |
          npm run lint
          # The stylelint token-discipline gate (issue #36) was local-only
          # until wave-L round 4 — the bundled-fonts @font-face slip
          # (fonts.css quoted family name, committed in 92311eb2, caught
          # only by a sandbox lint run) proved the gap: a CSS gate that
          # CI never runs cannot gate. Chained here, keep-going as above.
          npm run lint:css

      # Added by card 4.H3 (agent P4-H3): l10n catalog gate — en-US 100%
      # key coverage, no duplicates, doc 07 §6.1 key grammar + §6.2
      # placeholder grammar, allowlist shape.
      - name: "3. l10n catalog check"
        if: always()
        run: npm run l10n:check

      - name: "4. unit tests (vitest)"
        if: always()
        run: npm run test

      - name: "5. e2e smoke (playwright, chromium)"
        if: always()
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload Playwright report
        if: always() # upload even (especially) when e2e failed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-ui
          path: ui/playwright-report/
          retention-days: 7

  # ------------------------------------------------------------------------
  # Visual screenshot-diff, PR-lite lane (card 4.G1/G2, doc 08 §6.3):
  # 1280x720 @1x, dark + light — 25 routes × 2 modes = 50 cases against the
  # committed Linux baselines (e2e/visual/baselines/linux/), re-pinned
  # 2026-11-13 (proven green: 50 passed 1.6m; provenance in
  # e2e/visual/MATRIX-20261113.md). Runs on every push/PR as the fast
  # signal; ubuntu-only because only the Linux baseline set is committed
  # (per-OS sets are the doc 08 §6.3 reality; the seed job below grows the
  # others). The full 216-case matrix is the visual-full job below — also
  # per-PR since FX8-A07, so this lane is the fast first signal, not the
  # only per-PR one.
  # ------------------------------------------------------------------------
  visual:
    name: visual (PR-lite lane — 50 cases vs pinned Linux baselines)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache Playwright browsers (chromium)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: "visual: PR-lite lane (compare vs committed baselines)"
        run: node scripts/visual-run.mjs --mode=pr

      # Wave-L round 4 (run 43400611004 diagnosis): the report artifact
      # carries no diff IMAGES (playwright-report references
      # test-results/ paths that are not uploaded), so a CI-side drift
      # could only be theorized about. This uploads the actual
      # expected/actual/diff PNGs on failure — the next red run carries
      # its own evidence, and host-parity fixes get made against pixels,
      # not hypotheses.
      - name: Upload failing diff images (test-results)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload visual report
        if: always() # upload even (especially) when the diff failed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-visual
          path: ui/playwright-report/visual/
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------------
  # Visual screenshot-diff, full matrix (doc 08 §6.3 "full matrix nightly"):
  # 216 cases (25 routes x viewports/DPI/modes + accent sampling, cards
  # 4.G2 + w26.k20). FX8-A07 (2026-11-26): gates EVERY push/PR — it was
  # schedule/dispatch-only (as `visual-nightly`) and a visual regression
  # could ship undetected for up to 24h (FIX-PLAN §4 F2.2). Un-gating is
  # affordable: the full compare measures 7.1–7.2 minutes on the pinned
  # baselines (MATRIX-20261113.md addenda) against this job's 25-minute
  # timeout. The PR-lite lane above stays as the fast signal; the nightly
  # schedule re-runs this same job on a quiet tree. Guarded against
  # re-gating + count drift by ui/src/test/fx8_a07_visual_lane_truth.test.ts.
  # ------------------------------------------------------------------------
  visual-full:
    name: visual (full matrix — 216 cases, every push/PR)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache Playwright browsers (chromium)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: "visual: full matrix (compare vs committed baselines)"
        run: node scripts/visual-run.mjs --mode=nightly

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-visual-full
          path: ui/playwright-report/visual/
          retention-days: 14
          if-no-files-found: ignore

  # ------------------------------------------------------------------------
  # [BLOCKED on first real macOS/Windows run] BASELINE SEED (issue #5):
  # macOS/Windows visual baselines CANNOT be captured from this repo's
  # Linux sandbox — font rasterization is per-OS (doc 08 §6.3). This job
  # runs --update-snapshots on the FULL nightly matrix to CAPTURE the
  # per-OS baseline set and uploads it as an artifact; a human then
  # reviews + commits e2e/visual/baselines/<platform>/. It is NON-BLOCKING
  # (continue-on-error + never a required check) and runs only on schedule
  # /dispatch. Until the baselines are committed, a compare-mode run on
  # these OSes fails by design (missing baselines) — no fake green.
  # ------------------------------------------------------------------------
  visual-baseline-seed:
    name: "[BLOCKED on first real run] visual baseline seed (${{ matrix.os }})"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: "SEED: capture ${{ matrix.os }} baselines (--update-snapshots, full nightly matrix)"
        run: node scripts/visual-run.mjs --mode=nightly --update

      - name: Upload captured baselines for human review + commit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines-${{ matrix.os }}
          path: ui/e2e/visual/baselines/
          retention-days: 30
          if-no-files-found: warn
