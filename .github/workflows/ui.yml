# Lumen UI CI — PROPOSAL from card 4.A1 (agent P4-A1, relaunch 2).
#
# ⚠️ LEAD-OWNED FILE: this workflow is PROPOSED in branch wip/p4-a1 for the
# Lead to review and wire at merge (card 4.A1 AC: "CI job is proposed, Lead
# wires it"). It has NOT run in GitHub Actions from this branch — verify the
# action pins + node version against your conventions before merging.
#
# Parity target: the ui/ portion of the doc 10 §2 gate parity table that
# ci.yml explicitly defers ("the UI/tauri/wasm steps... land with their
# owning cards" — .github/workflows/ci.yml:24). Local equivalents proven
# green in the 4.A1 closure session (2026-10-23): typecheck, lint (0 errors,
# 1 accepted react-refresh warning), vitest 9/9, Playwright smoke 1/1 on
# chromium 156.0.8078.4.
#
# Design notes (mirrors ci.yml conventions where they apply):
#   * ONE lean ubuntu job — no OS matrix yet (doc 08 §9.3 matrix comes with
#     real screens); 15-min timeout.
#   * `if: always()` keep-going aggregation on the four gate steps, exactly
#     like ci.yml's full_gate.sh replication — one failing step never hides
#     the state of the others.
#   * node 24 (matches the local dev node 24.21.0 recorded in ui/README);
#     npm cache via setup-node, keyed on ui/package-lock.json.
#   * Playwright browsers cached via actions/cache keyed on the lockfile —
#     `npx playwright install --with-deps chromium` is a fast no-op on hit
#     and self-installs system deps on miss. `PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD`
#     is NOT set on the `npm ci` step, so browsers download once, into the
#     cache-restored dir, then e2e reuses them.
#   * HTML report always uploaded (name: playwright-report-ui) so red runs
#     are debuggable from the run page.
#
# Action pins (resolved via `git ls-remote` on 2026-10-23, 4.A1 closure):
#   actions/checkout        v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1  (same as ci.yml)
#   actions/setup-node      v6.0.0  2028fbc5c25fe9cf00d9f06a71cc4710d4507903
#   actions/cache           v4.3.0  0057852bfaa89a56745cba8c7296529d2fc39830
#   actions/upload-artifact v6.0.0  b7c566a772e6b6bfb58ed0dc250532a479d7789f

name: UI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ui

concurrency:
  # One run per branch/PR head (doc 10 §10.1), same shape as ci.yml.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    name: ui (typecheck / lint / vitest / playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      # --- gate steps: keep-going aggregation (if: always()) ---------------
      - name: "1. typecheck"
        if: always()
        run: npm run typecheck

      - name: "2. lint"
        if: always()
        run: npm run lint

      # Added by card 4.H3 (agent P4-H3): l10n catalog gate — en-US 100%
      # key coverage, no duplicates, doc 07 §6.1 key grammar + §6.2
      # placeholder grammar, allowlist shape. Lead reviews at merge.
      - name: "3. l10n catalog check"
        if: always()
        run: npm run l10n:check

      - name: "4. unit tests (vitest)"
        if: always()
        run: npm run test

      - name: "5. e2e smoke (playwright, chromium)"
        if: always()
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload Playwright report
        if: always() # upload even (especially) when e2e failed
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-ui
          path: ui/playwright-report/
          retention-days: 7
