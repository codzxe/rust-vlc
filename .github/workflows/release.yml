# Lumen Release — tag-triggered cross-platform artifact pipeline
# (issue #56 release-engineering half + user release requirements,
# card 7.w22g; REWIRED onto the W24-C packaging lanes in r3).
#
# WHAT SHIPS TODAY: the `lumen` CLI (package lumen-cli, apps/cli — the
# real engine surface: demux/decode/playback through the ONE command
# layer), `lumen-desktop` (package desktop, apps/desktop — the std-only
# ADR-004 composition-root skeleton) and, since W26-M, `lumen-tauri`
# (package lumen-desktop-tauri, apps/desktop-tauri — the ADR-004
# webview shell: a workspace-EXCLUDED crate with its own Cargo.lock,
# built on every lane below; INFRA-BLOCKED.md §B.1/§C).
# Payload honesty (W24-R1 P2-4): tar.gz/zip/deb/rpm/msi package the
# binaries + the [shipped] docs list; the AppImage and the macOS
# .app/.dmg/app-zip are GUI-shell payloads (no CLI, no docs) —
# per-artifact payload table in docs/packaging/README.md. The tauri
# binary rides the SAME installer payloads (the payload lists are
# packaging-script/config-owned — W26-M T2/T3); no new artifact names.
# Nothing claims a GUI that does not exist.
#
# HONESTY NOTE — THIS WORKFLOW HAS NEVER EXECUTED (CI billing blocked):
# every Actions run in this repository currently dies at 0 steps
# (spending limit on the private repo; worklog 7.CLOSEOUT; issues
# #53/#56 track it). Correctness evidence, strongest first:
#   * the ENTIRE Linux lane (tar.gz + .deb + .AppImage + rpm spec,
#     packaged-binary launch tests, per-artifact SBOMs, checksum
#     manifest) was EXECUTED for real on this host — see
#     docs/packaging/evidence/linux-lane-20261110.log;
#   * the same script the Linux jobs below run (verify-linux-
#     artifacts.sh) is that proof script — no CI-only divergence;
#   * every script below passes `bash -n` + `sh -n`, and the locally
#     provable halves of the Windows/macOS lanes (.wxs generation,
#     env assertions, unsigned-fallback sidecars, SBOM writing) run in
#     scripts/packaging/gate.sh (full_gate step 11);
#   * this file parses (python yaml.safe_load) and follows ci.yml's
#     proven action-pin patterns.
# Runtime claims that could not be exercised here are marked [VERIFY]
# inline. When Actions billing is unblocked, run a `workflow_dispatch`
# dry-run first: it builds and uploads all artifacts WITHOUT cutting a
# release (the `gh release create` step is tag-ref-gated).
#
# CONFIG-DRIVEN — NO PRODUCT/VERSION/PACKAGING LITERALS IN THIS FILE:
# product identity (name, version, publisher, per-OS identifiers, MSI
# UpgradeCode, both bin names) comes from product.toml, and every
# packaging decision (install dirs, shipped docs, SBOM suffix + spec
# version, checksum algorithm + manifest name, upgrade-test gate,
# signing secret NAMES) comes from packaging/packaging.toml — both
# merged into the job environment by scripts/packaging/
# packaging-env.py (the W24-C bridge; it wraps and re-uses the wave-22
# scripts/release/product-env.py). A rebrand, version bump, docs-list
# change, or checksum-algorithm change touches the TOML only. The
# single sanctioned exception: the Cargo package ids in the build
# commands and the packaging-env.py invocation (`lumen-cli`, `desktop`,
# plus the W26-M tauri pair `lumen-desktop-tauri` +
# apps/desktop-tauri/Cargo.toml) — crate names/paths needed to address
# the builds, not product identity.
# A second, same-shaped exception: the `secrets.<NAME>` references in
# the signing steps' env: blocks — GitHub's secrets context only takes
# static keys, so the secret NAMES configured in packaging.toml
# [signing.*] are repeated there; every mapping is guarded by a
# fail-loud cross-check whose expected set is DERIVED FROM
# packaging.toml at guard time (a step errors if a name drifts OR if a
# future [signing.*] *_env key is added without a mapping), so the
# TOML stays the source of truth (W24-R1 P1-2; W24-R6 P4-1 hardening,
# W24-Q).
#
# LANE MAP (per-platform jobs -> scripts/packaging/* drivers):
#   windows: build-zip.sh (flat zip) + build-msi.sh (gen-wxs + WiX +
#            sign-windows.sh) + test-msi-upgrade.ps1 (config-gated)
#   macos:   build-dmg.sh (make-app + sign-macos.sh --app + make-dmg +
#            sign-macos.sh --dmg: codesign/notarize/staple, R-35
#            sidecars when credentials are absent)
#   linux:   verify-linux-artifacts.sh (tar.gz + deb + AppImage + rpm
#            + launch tests + SBOMs + per-set manifest) — the SAME
#            script proven locally
#   every OS lane (W26-M): the tauri webview app build —
#            packaging-env.py --tauri-* (exports BIN_TAURI) + the
#            ui/dist embed build + cargo build --manifest-path
#            apps/desktop-tauri (webkit2gtk dev packages on the two
#            linux lanes; INFRA-BLOCKED.md §B.1/§C)
#   every job: gen-sboms.sh (per-artifact CycloneDX SBOM)
#   release job: global checksum manifest (algorithm + name from
#            packaging.toml) + notes + `gh release create`
#
# Action pins (mirror of the ci.yml pin table; the first four are the
# exact SHAs recorded there. download-artifact resolved the same way —
# `git ls-remote` — on 2026-11-10 for this card, since ci.yml never
# needed it):
#   actions/checkout          v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1  (tag, lightweight)
#   dtolnay/rust-toolchain    1.99.1  d124f86f28ff42855784ff3319f48ac182c248f8  (branch head)
#   Swatinem/rust-cache       v2.9.2  6323deb102c322ba6fcbdcafc7e3dddab59af2b6  (peeled tag commit)
#   actions/upload-artifact   v7.0.2  cf430e030ddbb5b0abf93d22962f4752f3646cd9  (tag, lightweight)
#   actions/download-artifact v8.0.2  9000827ccba6bdab643e8b6fd33ac0654aef8333  (tag, lightweight; = main head at resolution time)
# Non-action tools pinned below with SHA-256 verification (the ci.yml
# cargo-deny posture — no floating tool installs):
#   WiX v5.0.2          wix.5.0.2.nupkg from the nuget.org flat-container
#                       (deterministic URL; contains tools/net6.0/any/wix.exe)
#   appimagetool 1.9.1  release assets from github.com/AppImage/appimagetool
#                       (x86_64 + aarch64)
#   type2 runtime       dated release tag 20251108 from
#                       github.com/AppImage/type2-runtime (x86_64 + aarch64)
#                       — passed to appimagetool --runtime-file so NO rolling
#                       runtime is fetched at build time
# `gh`, `pwsh`, `hdiutil`/`ditto`, `dpkg-deb`, `apt-get install rpm`,
# and `node`/`npm` (the ui/dist embed build) are preinstalled/native
# on their respective runner images [VERIFY at first live run].
#
# RUNNER BUDGET (same honesty as ci.yml): this workflow only runs on
# tag pushes (a handful of times per release cycle, never per-PR). At
# the private-repo multipliers (windows 2x, macOS 10x) a full run is
# roughly 6 jobs x ~15-25 raw minutes ≈ 200-300 billed minutes —
# acceptable ONLY because it is tag-gated. The optional arm64 job is
# continue-on-error (see its own comment). W26-M: every lane also
# builds the workspace-excluded tauri crate (~470-package closure) and
# the ui/dist npm build — expect the upper end of those ranges (the
# macOS multiplier bites hardest) [VERIFY at first live run].

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual dry-run: builds + uploads artifacts, no release (see `release` job)

permissions:
  contents: write # `gh release create` with the built-in GITHUB_TOKEN

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0" # leaner target dir + cache on 2-core runners
  CARGO_TERM_COLOR: always
  # Overrides the sandbox-path build.target-dir pinned in the committed
  # .cargo/config.toml (ci.yml "CURRENT REALITY RECONCILIATIONS" #2).
  CARGO_TARGET_DIR: target

jobs:
  # ------------------------------------------------------------------------
  # Windows x64: flat zip + MSI (WiX v5, pinned nupkg) + Authenticode
  # signing driver + config-gated MSI upgrade-path test.
  # ------------------------------------------------------------------------
  windows:
    name: windows (x86_64 — zip + msi)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OS_ID: windows
      ARCH_ID: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch — matches rust-toolchain.toml
      - name: Assert toolchain pin (rust-toolchain.toml == action == effective rustc)
        run: |
          pin="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          inst="${{ steps.toolchain.outputs.name }}"
          eff="$(rustc --version | sed -n 's/^rustc \([^ ]*\) (.*)$/\1/p')"
          echo "rust-toolchain.toml channel : ${pin}"
          echo "workflow action installed    : ${inst}"
          echo "effective rustc              : ${eff}"
          if [ "${pin}" != "${inst}" ] || [ "${pin}" != "${eff}" ]; then
            echo "::error::toolchain mismatch - bump the dtolnay/rust-toolchain ref in .github/workflows/release.yml to match rust-toolchain.toml, and check for a RUSTUP_TOOLCHAIN override on the runner"
            exit 1
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Parse product.toml + packaging.toml -> job env (config-driven identity AND packaging)
        run: |
          # python3 is the image default on all three OSes [VERIFY at
          # first live run]; python is the git-bash fallback.
          PY="$(command -v python3 || command -v python)" || { echo "::error::no python3/python on runner"; exit 1; }
          # --tauri-package/--tauri-manifest (W26-M): export BIN_TAURI
          # from the SUBCRATE'S OWN lockfile — apps/desktop-tauri is
          # workspace-EXCLUDED (root Cargo.toml `exclude`), so the
          # root cargo metadata this bridge wraps cannot see the
          # crate; the manifest path addresses it directly.
          "$PY" scripts/packaging/packaging-env.py \
            --cli-package lumen-cli --desktop-package desktop \
            --tauri-package lumen-desktop-tauri \
            --tauri-manifest apps/desktop-tauri/Cargo.toml \
            --github-env --github-env-file "$GITHUB_ENV"
      - name: Build (release, locked — the two workspace binaries)
        run: cargo build --release --locked -p lumen-cli -p desktop
      - name: Build the embedded UI (ui/dist for tauri-codegen — must precede the tauri build)
        run: |
          # ORDER IS LOAD-BEARING (W26-M): tauri.conf.json frontendDist
          # is ../../ui/dist and tauri-codegen embeds it AT COMPILE
          # TIME — a missing/stale ui/dist would bake an empty or
          # stale frontend into the binary. Same ordering rule (and
          # the same --no-audit/--no-fund invocation) the ci.yml
          # tauri-check lane proves.
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build
          test -f ui/dist/index.html \
            || { echo "::error::ui/dist/index.html missing after vite build"; exit 1; }
      - name: Build the tauri webview app (workspace-excluded subcrate — release, locked)
        run: |
          # NOT a workspace feature: apps/desktop-tauri is EXCLUDED
          # from the root workspace (root Cargo.toml `exclude`; its
          # own Cargo.lock carries the tauri closure), so this is the
          # INFRA-BLOCKED.md §C recipe's exact --manifest-path build
          # against that lockfile. CARGO_TARGET_DIR=target (workflow
          # env) lands target/release/lumen-tauri in the SAME target
          # dir the packaging scripts below stage from.
          # Windows: NO system webview dev packages — the WebView2
          # runtime ships with Windows 10/11 (Evergreen) and the
          # loader rides the wry/tauri dependency closure [VERIFY at
          # first live run].
          cargo build --release --locked --manifest-path apps/desktop-tauri/Cargo.toml
      - name: Install WiX v5.0.2 (pinned nupkg, SHA-256 verified)
        run: |
          # Deterministic URL: the nuget.org v3 flat-container address of
          # the wix .NET tool package. The nupkg carries
          # tools/net6.0/any/wix.exe (+ deps); wix.runtimeconfig.json
          # sets rollForward=Major, so the .NET 8/9 runtimes on
          # windows-latest satisfy the net6.0 target [VERIFY].
          wix_url="https://api.nuget.org/v3-flatcontainer/wix/5.0.2/wix.5.0.2.nupkg"
          wix_sha256="f30ef0c74e2a986126539c5780be93ac24e8136eaf723b1937b26272703ae173"
          curl -sSfL -o /tmp/wix.5.0.2.nupkg "$wix_url"
          echo "${wix_sha256}  /tmp/wix.5.0.2.nupkg" | sha256sum -c -
          PY="$(command -v python3 || command -v python)"
          "$PY" -m zipfile -e /tmp/wix.5.0.2.nupkg .tools/wix
          test -x .tools/wix/tools/net6.0/any/wix.exe
          echo "WIX_EXE=${PWD}/.tools/wix/tools/net6.0/any/wix.exe" >> "$GITHUB_ENV"
      - name: Package flat zip (scripts/packaging/build-zip.sh — exes + [shipped] docs from config)
        run: scripts/packaging/build-zip.sh
      - name: Package MSI (scripts/packaging/build-msi.sh — config-driven .wxs + WiX + sign-windows.sh)
        # sign-windows.sh (called inside): real signtool signing when the
        # user-owned certificate secrets exist; explicit .UNSIGNED.txt
        # sidecar + ::warning:: when they do not (never fake signing).
        #
        # SECRET WIRING (W24-R1 P1-2): GitHub does NOT inject repository
        # secrets as env vars on its own — without this env: block the
        # runbook's "set the repository secrets" next-step changed
        # nothing and releases stayed unsigned forever, silently. The
        # names below are the ones configured in packaging.toml
        # [signing.windows]; an absent secret arrives as an EMPTY string,
        # so the honest-unsigned path is unchanged.
        env:
          WINDOWS_SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_B64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          # Fail-loud wiring guard: every secret name configured in
          # packaging.toml [signing.windows] must be mapped in this
          # step's env: block. The expected set is DERIVED FROM
          # packaging.toml AT GUARD TIME (python parses the same TOML the
          # parse step schema-validated; every [signing.*] key ending in
          # _env names a secret), so a future [signing.*] key is
          # automatically required to be mapped too — the guard no longer
          # enumerates only the names it knows (W24-R1 P1-2, hardened in
          # W24-Q after W24-R6 P4-1). An unmapped name is UNSET — how a
          # config change that outlived this mapping would silently
          # disable signing — while an absent-but-mapped secret is an
          # empty string (honest unsigned).
          PY="$(command -v python3 || command -v python)" || { echo "::error::no python3/python on runner"; exit 1; }
          for cfg in $("$PY" - windows <<'PYEOF'
          import sys, tomllib
          with open("packaging/packaging.toml", "rb") as fh:
              signing = tomllib.load(fh)["signing"]
          for section in sys.argv[1:]:
              for key in sorted(signing[section]):
                  if key.endswith("_env"):
                      print(f"PACKAGING_SIGNING_{section.upper()}_{key.upper()}")
          PYEOF
          ); do
            # Python on Windows writes \r\n to stdout; $(...) strips the
            # \n but NOT the \r — the guard's indirect expansion then dies
            # with "invalid variable name" (run 43378757248, MSI lane,
            # line-24 failure). Strip the CR before any use of $cfg.
            cfg="${cfg%$'\r'}"
            name="${!cfg-}"
            if [ -z "$name" ]; then
              echo "::error::$cfg is not exported — packaging.toml [signing.*] and scripts/packaging/packaging-env.py are out of sync (the bridge must export every [signing.*] *_env key)"
              exit 1
            fi
            if [ -z "${!name+x}" ]; then
              echo "::error::secret wiring gap: packaging.toml names \$$name but this step's env: block does not map it — update the mapping (docs/packaging/README.md blockers table)"
              exit 1
            fi
          done
          scripts/packaging/build-msi.sh
      - name: "MSI upgrade-path test (config-gated: packaging.toml windows.upgrade_test)"
        run: |
          if [ "${PACKAGING_WINDOWS_UPGRADE_TEST:?}" != "true" ]; then
            echo "skipped: packaging.toml [windows] upgrade_test = ${PACKAGING_WINDOWS_UPGRADE_TEST}"
            exit 0
          fi
          base="${PRODUCT_LOWER:?}-${PRODUCT_VERSION:?}-${ARCH_ID:?}-${OS_ID:?}"
          # pwsh (PowerShell 7) is preinstalled on windows-latest [VERIFY
          # at first live run]. The test installs a predecessor MSI built
          # from the same tree + frozen UpgradeCode, then proves the
          # current one REPLACES it (MajorUpgrade semantics).
          pwsh scripts/packaging/test-msi-upgrade.ps1 -CurrentMsi "dist/${base}.msi"
      - name: Per-artifact SBOM (gen-sboms.sh — CycloneDX, suffix + spec version from config)
        run: |
          base="${PRODUCT_LOWER:?}-${PRODUCT_VERSION:?}-${ARCH_ID:?}-${OS_ID:?}"
          scripts/packaging/gen-sboms.sh "dist/${base}.zip" "dist/${base}.msi"
      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows-x86_64
          path: dist/**
          retention-days: 90
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # macOS arm64 (macos-latest = arm64 hardware): .app bundle -> codesign
  # -> .dmg -> sign + notarize + staple, plus the ditto .app zip.
  #
  # UNIVERSAL-BINARY DECISION (card 8.E2 deliverable, recorded here +
  # docs/packaging/README.md): ship TWO per-arch dmg/app sets —
  # aarch64 on macos-latest, x86_64 on macos-15-intel — NOT one
  # lipo'd universal .app. Rationale:
  #   * a universal .app means building BOTH rust targets in one job
  #     and lipo-creating the binaries: ~2x build time on the most
  #     expensive runner class (macOS 10x multiplier) for every
  #     release, where the per-arch split pays that cost once per
  #     slice and parallelizes;
  #   * every artifact stays self-contained: its own SBOM, its own
  #     checksum line, its own (future R-35) signature — a universal
  #     dmg would additionally need every slice signed
  #     (docs/inventory/platform-macos.md: "Universal (arm64+x86_64)
  #     builds require signing each slice"), which cannot even be
  #     exercised until R-35 resolves;
  #   * the download self-selects by arch today (the arch segment in
  #     the artifact name comes from product.toml per-OS identifiers);
  #   * reversible purely in this file (add `--target
  #     aarch64-apple-darwin --target x86_64-apple-darwin` + a lipo
  #     step): no packaging script or config change needed, so the
  #     cheap option ships first.
  # Revisit trigger: R-35 (Apple Developer account) unblocks and a
  # user preference for a single universal download is recorded.
  # ------------------------------------------------------------------------
  macos-arm64:
    name: macos (aarch64 — dmg + app zip)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      OS_ID: macos
      ARCH_ID: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch — matches rust-toolchain.toml
      - name: Assert toolchain pin (rust-toolchain.toml == action == effective rustc)
        run: |
          pin="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          inst="${{ steps.toolchain.outputs.name }}"
          eff="$(rustc --version | sed -n 's/^rustc \([^ ]*\) (.*)$/\1/p')"
          echo "rust-toolchain.toml channel : ${pin}"
          echo "workflow action installed    : ${inst}"
          echo "effective rustc              : ${eff}"
          if [ "${pin}" != "${inst}" ] || [ "${pin}" != "${eff}" ]; then
            echo "::error::toolchain mismatch - bump the dtolnay/rust-toolchain ref in .github/workflows/release.yml to match rust-toolchain.toml, and check for a RUSTUP_TOOLCHAIN override on the runner"
            exit 1
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Parse product.toml + packaging.toml -> job env (config-driven identity AND packaging)
        run: |
          PY="$(command -v python3 || command -v python)" || { echo "::error::no python3/python on runner"; exit 1; }
          # --tauri-package/--tauri-manifest (W26-M): export BIN_TAURI
          # from the SUBCRATE'S OWN lockfile — apps/desktop-tauri is
          # workspace-EXCLUDED (root Cargo.toml `exclude`), so the
          # root cargo metadata this bridge wraps cannot see the
          # crate; the manifest path addresses it directly.
          "$PY" scripts/packaging/packaging-env.py \
            --cli-package lumen-cli --desktop-package desktop \
            --tauri-package lumen-desktop-tauri \
            --tauri-manifest apps/desktop-tauri/Cargo.toml \
            --github-env --github-env-file "$GITHUB_ENV"
      - name: Build (release, locked — the two workspace binaries)
        run: cargo build --release --locked -p lumen-cli -p desktop
      - name: Build the embedded UI (ui/dist for tauri-codegen — must precede the tauri build)
        run: |
          # ORDER IS LOAD-BEARING (W26-M): tauri.conf.json frontendDist
          # is ../../ui/dist and tauri-codegen embeds it AT COMPILE
          # TIME — a missing/stale ui/dist would bake an empty or
          # stale frontend into the binary. Same ordering rule (and
          # the same --no-audit/--no-fund invocation) the ci.yml
          # tauri-check lane proves.
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build
          test -f ui/dist/index.html \
            || { echo "::error::ui/dist/index.html missing after vite build"; exit 1; }
      - name: Build the tauri webview app (workspace-excluded subcrate — release, locked)
        run: |
          # NOT a workspace feature: apps/desktop-tauri is EXCLUDED
          # from the root workspace (root Cargo.toml `exclude`; its
          # own Cargo.lock carries the tauri closure), so this is the
          # INFRA-BLOCKED.md §C recipe's exact --manifest-path build
          # against that lockfile. CARGO_TARGET_DIR=target (workflow
          # env) lands target/release/lumen-tauri in the SAME target
          # dir the packaging scripts below stage from.
          # macOS: NO system packages — WKWebView/AppKit are
          # OS-provided frameworks; this build only links them
          # [VERIFY at first live run].
          cargo build --release --locked --manifest-path apps/desktop-tauri/Cargo.toml
      - name: macOS lane (scripts/packaging/build-dmg.sh — bundle, codesign, dmg, notarize, staple)
        # sign-macos.sh (called inside, twice): real codesign/notarytool/
        # stapler when the user-owned Apple credentials exist; explicit
        # .UNSIGNED.txt / .NOT-NOTARIZED.txt sidecars + ::warning:: when
        # they do not (risk R-35, owner = user — never fake signing).
        #
        # SECRET WIRING (W24-R1 P1-2, same contract as the windows job's
        # MSI step): the six secret names configured in packaging.toml
        # [signing.macos], mapped to env for sign-macos.sh. Absent
        # secrets arrive as EMPTY strings -> honest-unsigned unchanged.
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_SIGNING_CERT_P12_B64: ${{ secrets.MACOS_SIGNING_CERT_P12_B64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Fail-loud wiring guard (W24-R1 P1-2; W24-Q hardening after
          # W24-R6 P4-1): every secret name configured in packaging.toml
          # [signing.macos] must be mapped in this step's env: block —
          # unset means wiring gap, empty means absent credential (the
          # honest unsigned path). The expected set is DERIVED FROM
          # packaging.toml at guard time (python parses the same TOML the
          # parse step schema-validated), so a future [signing.macos]
          # key is automatically required to be mapped too.
          PY="$(command -v python3 || command -v python)" || { echo "::error::no python3/python on runner"; exit 1; }
          for cfg in $("$PY" - macos <<'PYEOF'
          import sys, tomllib
          with open("packaging/packaging.toml", "rb") as fh:
              signing = tomllib.load(fh)["signing"]
