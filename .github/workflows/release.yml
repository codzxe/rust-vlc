          tool_url="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-aarch64.AppImage"
          tool_sha256="f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158"
          runtime_url="https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-aarch64"
          runtime_sha256="00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444"
          curl -sSfL -o appimagetool.AppImage "$tool_url"
          echo "${tool_sha256}  appimagetool.AppImage" | sha256sum -c -
          chmod +x appimagetool.AppImage
          curl -sSfL -o type2-runtime "$runtime_url"
          echo "${runtime_sha256}  type2-runtime" | sha256sum -c -
          echo "APPIMAGETOOL=${PWD}/appimagetool.AppImage" >> "$GITHUB_ENV"
          echo "RUNTIME_FILE=${PWD}/type2-runtime" >> "$GITHUB_ENV"
      - name: Install rpmbuild (the real binary .rpm lane — the local proof could only validate the spec)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends rpm
      - name: Package + verify (verify-linux-artifacts.sh — the locally-PROVEN harness)
        run: scripts/packaging/verify-linux-artifacts.sh
      - name: Scope the per-set checksum manifest (avoid flat-merge collision)
        run: |
          base="${PRODUCT_LOWER:?}-${PRODUCT_VERSION:?}-${ARCH_ID:?}-${OS_ID:?}"
          mv "dist/${PACKAGING_CHECKSUM_MANIFEST:?}" "dist/${base}.${PACKAGING_CHECKSUM_MANIFEST}"
          ls -l dist/
      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-aarch64
          path: dist/**
          retention-days: 90
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # Release: needs all build jobs, runs on the tag (or dispatch dry-run).
  # - downloads every dist-* artifact (merge-multiple: one flat dir)
  # - writes the global checksum manifest over all assets (algorithm +
  #   file name from packaging.toml [checksum] — the per-arch set
  #   manifests uploaded by the Linux jobs ride along as ordinary
  #   assets and are hashed too)
  # - generates notes (git log since last tag; docs/RELEASE.md template)
  # - cuts the GitHub release with the PREINSTALLED gh CLI + GITHUB_TOKEN
  #   (no third-party release action), tag refs only
  #
  # W26-M RECONCILIATION: this job needed NO step change for the tauri
  # webview app — the build lanes upload dist/** as before and the
  # tauri binary rides INSIDE the existing installer payloads (zip/
  # msi/tar.gz/deb/AppImage/dmg/app-zip; the packaging scripts own the
  # payload lists), so the dist-* download pattern, the artifact-kind
  # check, the checksum sweep and `gh release create dist/*` cover it
  # with zero delta. The workflow_dispatch dry-run rides the same
  # lanes (nothing here branches on the event type except the
  # release-cut steps themselves).
  # ------------------------------------------------------------------------
  release:
    name: release (checksum manifest + notes + gh release create)
    needs: [windows, macos-arm64, macos-x64, linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-notes.sh reads full history (git log since the
          # previous tag); the default shallow checkout truncates it.
          fetch-depth: 0
      - name: Parse product.toml + packaging.toml -> job env (identity + checksum config; no bins needed here)
        run: |
          PY="$(command -v python3 || command -v python)" || { echo "::error::no python3/python on runner"; exit 1; }
          "$PY" scripts/packaging/packaging-env.py --github-env --github-env-file "$GITHUB_ENV"
      - name: "Signing-credentials visibility (W24-R1 P1-2 hardening: absent = warned, unmapped = failed)"
        # Maps ALL eight configured signing names once more, here where
        # the whole release is assembled, so "credentials provisioned
        # but not wired" can never recur silently: an UNSET variable is a
        # wiring gap (hard error); an EMPTY one is an absent credential
        # (::warning:: naming the blockers-table owners).
        env:
          WINDOWS_SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_B64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_SIGNING_CERT_P12_B64: ${{ secrets.MACOS_SIGNING_CERT_P12_B64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          absent=""
          # The expected secret-name set is DERIVED FROM packaging.toml
          # at guard time (python parses the same TOML the parse step
          # schema-validated; every [signing.*] key ending in _env names
          # a secret), so a future [signing.*] key is automatically
          # required to be mapped here too (W24-Q hardening after
          # W24-R6 P4-1 — the guard used to enumerate only the 8 names
          # it knew).
          PY="$(command -v python3 || command -v python)" || { echo "::error::no python3/python on runner"; exit 1; }
          for cfg in $("$PY" - windows macos <<'PYEOF'
          import sys, tomllib
          with open("packaging/packaging.toml", "rb") as fh:
              signing = tomllib.load(fh)["signing"]
          for section in sys.argv[1:]:
              for key in sorted(signing[section]):
                  if key.endswith("_env"):
                      print(f"PACKAGING_SIGNING_{section.upper()}_{key.upper()}")
          PYEOF
          ); do
            # Python on Windows writes \r\n to stdout; $(...) strips the
            # \n but NOT the \r — the guard's indirect expansion then dies
            # with "invalid variable name" (run 43378757248, MSI lane,
            # line-24 failure). Strip the CR before any use of $cfg.
            cfg="${cfg%$'\r'}"
            name="${!cfg-}"
            if [ -z "$name" ]; then
              echo "::error::$cfg is not exported — packaging.toml [signing.*] and scripts/packaging/packaging-env.py are out of sync (the bridge must export every [signing.*] *_env key)"
              exit 1
            fi
            if [ -z "${!name+x}" ]; then
              echo "::error::secret wiring gap: packaging.toml names \$$name but this step's env: block does not map it — update the mapping (docs/packaging/README.md blockers table)"
              exit 1
            fi
            [ -n "${!name}" ] || absent="$absent $name"
          done
          if [ -n "$absent" ]; then
            echo "::warning::signing credentials absent — this release ships labeled-unsigned artifacts + checksums (blockers 1-2, owner: user):$absent"
          else
            echo "all configured signing credentials are present — artifacts should be signed"
          fi
      - name: Download all dist artifacts (flat merge)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Verify artifact set (non-empty, expected kinds present)
        run: |
          test -n "$(find dist -type f -print -quit)" || { echo "::error::no artifacts downloaded"; exit 1; }
          # Honest expectation: the five blocking artifact sets. arm64 is
          # best-effort and may be absent — that absence is reported, not
          # fatal (mirrors the linux-arm64 continue-on-error decision).
          # Artifact names are <slug>-<version>-<arch>-<os>.<ext>, so the
          # OS segment is dash-joined: match *-<kind> (the wave-22 form
          # *.<kind> matched NOTHING — a latent no-op caught by the r3
          # local dry-run, docs/packaging/evidence/w24c-r3.log).
          ls -l dist/
          for kind in windows.zip windows.msi macos.dmg macos.zip \
                      linux.tar.gz linux.deb linux.AppImage linux.rpm; do
            if ls dist/*-"$kind" >/dev/null 2>&1; then
              echo "artifact kind present: ${kind}"
            else
              echo "::warning::artifact kind missing: ${kind} (arm64 best-effort or job failure — check the build jobs)"
            fi
          done
          # Per-artifact SBOMs: suffix from packaging.toml [sbom].
          sbom_suffix="${PACKAGING_SBOM_ARTIFACT_SUFFIX:?}"
          if ls dist/*."${sbom_suffix}" >/dev/null 2>&1; then
            echo "per-artifact SBOMs present (suffix .${sbom_suffix})"
          else
            echo "::warning::no per-artifact SBOMs found (suffix .${sbom_suffix}) — check the build jobs"
          fi
      - name: Generate the global checksum manifest (algorithm + name from packaging.toml)
        run: |
          cd dist
          case "${PACKAGING_CHECKSUM_ALGORITHM:?}" in
            sha256) hasher=sha256sum ;;
            *) echo "::error::no wired hasher for algorithm ${PACKAGING_CHECKSUM_ALGORITHM} (packaging.toml checksum.algorithm)"; exit 1 ;;
          esac
          # Hash every asset BEFORE adding the manifest itself — the
          # manifest never hashes itself (same contract as the per-set
          # manifests the Linux jobs wrote).
          "$hasher" -- * >"../${PACKAGING_CHECKSUM_MANIFEST:?}"
          mv "../${PACKAGING_CHECKSUM_MANIFEST}" "./${PACKAGING_CHECKSUM_MANIFEST}"
          cat "./${PACKAGING_CHECKSUM_MANIFEST}"
      - name: Generate release notes (git log since last tag)
        run: scripts/release/release-notes.sh notes.md
      - name: Cross-check tag vs product.toml version (warning only — honest, not fatal)
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${tag_version}" != "${PRODUCT_VERSION}" ] && [ "${tag_version}" != "${MSI_VERSION}" ]; then
            echo "::warning::tag ${GITHUB_REF_NAME} matches neither identity.display_version (${PRODUCT_VERSION}) nor its numeric MSI form (${MSI_VERSION}) — intentional?"
          fi
      - name: Create the GitHub release (tag refs only; gh + GITHUB_TOKEN, no third-party action)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh` is preinstalled on GitHub-hosted runners [VERIFY at
          # first live run]. All assets ride along (packages, SBOMs,
          # per-set manifests, the .wxs audit source, signing sidecars);
          # the global manifest is regenerated above from exactly these
          # bytes.
          gh release create "$GITHUB_REF_NAME" \
            --title "${PRODUCT_NAME} ${PRODUCT_VERSION}" \
            --notes-file notes.md \
            dist/*
      - name: Dry-run summary (workflow_dispatch — no release was cut)
        if: github.ref_type != 'tag'
        run: |
          # Single grouped redirect (shellcheck SC2129; W25 actionlint fix).
          {
            echo "### Release dry-run (workflow_dispatch)"
            echo ""
            echo "Built and checksummed the full artifact set; NO GitHub release was"
            echo "created (that step is tag-ref-gated). Notes preview:"
            echo ""
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
