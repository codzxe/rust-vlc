            echo "::error::toolchain mismatch - bump the dtolnay/rust-toolchain ref in .github/workflows/release.yml to match rust-toolchain.toml, and check for a RUSTUP_TOOLCHAIN override on the runner"
            exit 1
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Parse product.toml + packaging.toml -> job env (config-driven identity AND packaging)
        run: |
          PY="$(command -v python3 || command -v python)" || { echo "::error::no python3/python on runner"; exit 1; }
          # --tauri-package/--tauri-manifest (W26-M): export BIN_TAURI
          # from the SUBCRATE'S OWN lockfile — apps/desktop-tauri is
          # workspace-EXCLUDED (root Cargo.toml `exclude`), so the
          # root cargo metadata this bridge wraps cannot see the
          # crate; the manifest path addresses it directly.
          "$PY" scripts/packaging/packaging-env.py \
            --cli-package lumen-cli --desktop-package desktop \
            --tauri-package lumen-desktop-tauri \
            --tauri-manifest apps/desktop-tauri/Cargo.toml \
            --github-env --github-env-file "$GITHUB_ENV"
      - name: Build (release, locked — the two workspace binaries)
        run: cargo build --release --locked -p lumen-cli -p desktop
      - name: Install webkit2gtk + GTK dev packages (the tauri build deps — ci.yml tauri-check's proven set)
        run: |
          # The tauri/wry webview compiles against webkit2gtk-4.1 on
          # Linux: these dev packages must be present BEFORE the
          # subcrate build below. The package list is EXACTLY the one
          # the ci.yml tauri-check lane installed green (the
          # INFRA-BLOCKED.md §B.1 dep set); ubuntu-latest and
          # ubuntu-24.04-arm carry the same names.
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev librsvg2-dev libxdo-dev \
            libssl-dev build-essential
          pkg-config --exists webkit2gtk-4.1 \
            || { echo "::error::webkit2gtk-4.1 still absent after install"; exit 1; }
      - name: Build the embedded UI (ui/dist for tauri-codegen — must precede the tauri build)
        run: |
          # ORDER IS LOAD-BEARING (W26-M): tauri.conf.json frontendDist
          # is ../../ui/dist and tauri-codegen embeds it AT COMPILE
          # TIME — a missing/stale ui/dist would bake an empty or
          # stale frontend into the binary. Same ordering rule (and
          # the same --no-audit/--no-fund invocation) the ci.yml
          # tauri-check lane proves.
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build
          test -f ui/dist/index.html \
            || { echo "::error::ui/dist/index.html missing after vite build"; exit 1; }
      - name: Build the tauri webview app (workspace-excluded subcrate — release, locked)
        run: |
          # NOT a workspace feature: apps/desktop-tauri is EXCLUDED
          # from the root workspace (root Cargo.toml `exclude`; its
          # own Cargo.lock carries the tauri closure), so this is the
          # INFRA-BLOCKED.md §C recipe's exact --manifest-path build
          # against that lockfile. CARGO_TARGET_DIR=target (workflow
          # env) lands target/release/lumen-tauri in the SAME target
          # dir the packaging scripts below stage from.
          # Linux: the webkit2gtk dev stack installed above is the one
          # system dependency the webview needs (the only OS in this
          # workflow with any).
          cargo build --release --locked --manifest-path apps/desktop-tauri/Cargo.toml
      - name: Install appimagetool 1.9.1 + type2 runtime (pinned, SHA-256 verified)
        run: |
          # Two pinned downloads (NOT rolling tags — pinning policy):
          # 1. appimagetool 1.9.1 from its GitHub release. Self-reports
          #    "git version 8c8c91f" — the 1.9.1 tag commit, cross-checked
          #    against `git ls-remote` at pin time (worklog 7.w22g).
          # 2. The AppImage type2 runtime from the DATED type2-runtime
          #    tag 20251108. Without --runtime-file appimagetool silently
          #    fetches the ROLLING `continuous` runtime at build time —
          #    a floating component this pipeline refuses (doc 11 §3.7).
          # Both tools are AppImages/ELFs: the packaging script runs with
          # APPIMAGE_EXTRACT_AND_RUN=1 because hosted runners do not
          # guarantee a usable FUSE (ubuntu-24.04 dropped libfuse2).
          tool_url="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          tool_sha256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          runtime_url="https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
          runtime_sha256="2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
          curl -sSfL -o appimagetool.AppImage "$tool_url"
          echo "${tool_sha256}  appimagetool.AppImage" | sha256sum -c -
          chmod +x appimagetool.AppImage
          curl -sSfL -o type2-runtime "$runtime_url"
          echo "${runtime_sha256}  type2-runtime" | sha256sum -c -
          echo "APPIMAGETOOL=${PWD}/appimagetool.AppImage" >> "$GITHUB_ENV"
          echo "RUNTIME_FILE=${PWD}/type2-runtime" >> "$GITHUB_ENV"
      - name: Install rpmbuild (the real binary .rpm lane — the local proof could only validate the spec)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends rpm
      - name: Package + verify (verify-linux-artifacts.sh — the locally-PROVEN harness)
        run: scripts/packaging/verify-linux-artifacts.sh
        # Builds tar.gz + deb + AppImage + the binary rpm, launch-tests
        # the packaged binaries (--version, decode-bench on a fixture,
        # the desktop skeleton exit code), asserts deb/rpm header fields
        # against the config, writes per-artifact SBOMs (gen-sboms.sh)
        # and the per-set checksum manifest.
      - name: Scope the per-set checksum manifest (avoid flat-merge collision)
        run: |
          # verify-linux-artifacts.sh writes the manifest under the plain
          # configured name (packaging.toml checksum.manifest_name); the
          # release job flat-merges BOTH linux sets into one directory,
          # so each set's manifest is renamed to <base>.<manifest> first.
          # The release job then writes THE global manifest under the
          # plain configured name (and hashes these per-set copies too).
          base="${PRODUCT_LOWER:?}-${PRODUCT_VERSION:?}-${ARCH_ID:?}-${OS_ID:?}"
          mv "dist/${PACKAGING_CHECKSUM_MANIFEST:?}" "dist/${base}.${PACKAGING_CHECKSUM_MANIFEST}"
          ls -l dist/
      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-x86_64
          path: dist/**
          retention-days: 90
          if-no-files-found: error

