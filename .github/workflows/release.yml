  # ------------------------------------------------------------------------
  # Linux x64: tar.gz + .deb (native dpkg-deb) + .AppImage (pinned
  # appimagetool) + .rpm (rpmbuild, apt-installed) + packaged-binary
  # launch tests — ALL via the locally-PROVEN harness
  # scripts/packaging/verify-linux-artifacts.sh (evidence:
  # docs/packaging/evidence/linux-lane-20261110.log).
  # ------------------------------------------------------------------------
  linux-x64:
    name: linux (x86_64 — tar.gz + deb + AppImage + rpm)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OS_ID: linux
      ARCH_ID: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch — matches rust-toolchain.toml
      - name: Assert toolchain pin (rust-toolchain.toml == action == effective rustc)
