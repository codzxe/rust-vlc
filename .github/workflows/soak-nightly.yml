# Lumen Soak-Nightly — the 4 h bounded-memory soak, nightly and
# NON-BLOCKING [PROPOSAL].
#
# Issue #18 (2026-11-09). The soak harness (crates/playback-engine/
# tests/soak/main.rs, card 3.E4/doc 13 wave 3.E) is env-configured, not
# a hardcoded long test: SOAK_MINUTES drives the REAL wall duration
# (CI-short default 2 min) and SOAK_LEAK_MB_PER_H the asserted
# live-bytes ceiling (generous default 50 MB/h). This job is the
# nightly tier: 240 min (4 h) at the 5 MB/h design target.
#
# [PROPOSAL] WHY 5 MB/h IS A PROPOSAL UNTIL FIRST REAL MEASUREMENT:
#   * The card's design target is 5 MB/h, but NO 4 h measurement has
#     been taken yet — the only real profile is the CI-short 2 min run
#     (recorded in docs/perf/). A 5 MB/h ceiling asserted over a 4 h
#     window is an extrapolation the first run may or may not bless.
#   * If the first nightly fails on a 5..50 MB/h slope, that is a
#     FINDING (either a real slow leak or a target that needs
#     renegotiation) — loosen SOAK_LEAK_MB_PER_H back toward 50 in THIS
#     file and record the real number in docs/perf/, do not delete the
#     job.
#
# [PROPOSAL] WHY NON-BLOCKING (the CI-Full issue #5 posture):
#   * schedule + workflow_dispatch only — no pull_request/push trigger,
#     so it can never gate a merge; do NOT add it to required checks.
#   * continue-on-error: false on purpose (below): a nightly that
#     silently swallows its own failure is a ritual, not a measurement.
#     Non-blocking comes from the trigger shape, not from lying about
#     the result. A red Soak-Nightly is a triage item within 24 h.
#
# First-run status [PENDING first real 4 h run]: every command shape is
# proven green at CI-short scale (the 2 min profile, docs/perf/); the
# 4 h/5 MB/h configuration runs for real for the first time on the
# first scheduled trigger.
#
# 8.C1 extension (issue #54, 2026-11-10) — two more jobs, same
# schedule, same non-blocking posture:
#
#   * soak-scenarios — the card's "4 h × scenarios" tier: the
#     config-driven scenario suite (crates/playback-engine/tests/
#     soak_scenarios/, tests/soak/scenarios-nightly.toml) at the
#     ASSERTED 5 MB/h design target (freeze-or-revise decision:
#     docs/soak/soak-report-20261110.md). Runs via
#     scripts/soak-scenarios.sh so the exit-code contract is the
#     wrapper's documented one.
#   * soak-lsan — the card's "LSAN nightly clean": parser + engine
#     crates and the CI-short scenario profile under LeakSanitizer on
#     a NIGHTLY toolchain (-Z sanitizer=leak is unstable-only; doc 10
#     §6.5). See that job's header for the honesty notes.
#
# COST NOTE (honest): three soak-family jobs ≈ 9 runner-hours per
# night. The single-loop `soak` job is issue #18's accepted
# deliverable and stays until the Lead retires it; the scenario suite
# is its intended successor (doc 10 §6.5 describes the suite shape,
# not a single loop). When CI billing unblocks, the Lead should decide
# which of the two 4 h tiers keeps running.
#
# HONESTY NOTE — NONE OF THESE JOBS HAS EVER EXECUTED: CI is
# billing-blocked on this private repository (every Actions run dies
# at 0 steps; docs/KNOWN-LIMITS.md R-16). Every command shape below
# is proven locally where the sandbox allowed it — see the job
# headers for exactly what is proven vs [VERIFY].
#
# Pinned actions (the ci.yml/ci-full.yml pins, verbatim):
#   actions/checkout        v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   dtolnay/rust-toolchain  1.99.1  d124f86f28ff42855784ff3319f48ac182c248f8  (branch head)
#   Swatinem/rust-cache     v2.9.2  6323deb102c322ba6fcbdcafc7e3dddab59af2b6  (peeled tag commit)
#   actions/upload-artifact v7.0.2  cf430e030ddbb5b0abf93d22962f4752f3646cd9  (tag, lightweight)

name: Soak-Nightly

on:
  schedule:
    # Nightly 03:00 UTC. (CI-Full deliberately runs 03:17 off-the-hour
    # to dodge the top-of-hour runner rush; this stays on the hour per
    # the issue #18 spec — if top-of-hour contention bites, shift it.)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # Never overlaps the merge-blocking CI group; a superseded manual
  # dispatch of the same ref is the only thing this cancels.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0" # leaner target dir + cache on 2-core runners
  CARGO_TERM_COLOR: always
  # Overrides the sandbox-path build.target-dir pinned in the committed
  # .cargo/config.toml (the ci.yml "CURRENT REALITY RECONCILIATIONS").
  CARGO_TARGET_DIR: target

jobs:
  soak:
    name: soak (4 h, 5 MB/h [PROPOSAL])
    runs-on: ubuntu-latest
    # 4 h soak + release build + cache restore; hard stop at 5 h.
    timeout-minutes: 300
    # NOT continue-on-error — see the header: non-blocking comes from
    # the schedule-only trigger shape, not from hiding the result.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch — matches rust-toolchain.toml
      - name: Assert toolchain pin (rust-toolchain.toml == action == effective rustc)
        run: |
          pin="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          inst="${{ steps.toolchain.outputs.name }}"
          eff="$(rustc --version | sed -n 's/^rustc \([^ ]*\) (.*)$/\1/p')"
          echo "rust-toolchain.toml channel : ${pin}"
          echo "workflow action installed    : ${inst}"
          echo "effective rustc              : ${eff}"
          if [ "${pin}" != "${inst}" ] || [ "${pin}" != "${eff}" ]; then
            echo "::error::toolchain mismatch - bump the dtolnay/rust-toolchain ref in .github/workflows/soak-nightly.yml to match rust-toolchain.toml, and check for a RUSTUP_TOOLCHAIN override on the runner"
            exit 1
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The nightly tier invocation (the harness's own documented
      # convention, tests/soak/main.rs header):
      #   * SOAK_MINUTES=240 — the 4 h REAL wall duration (not --ignored:
      #     duration is env-driven, the test is a plain #[test]).
      #   * SOAK_LEAK_MB_PER_H=5 — the design target [PROPOSAL], see
      #     header; the generous 50 MB/h stays as the CI-short default.
      #   * --release + --nocapture — the profile the 4 h number is
      #     meant to describe, with the markdown report in the log.
      #   * SOAK_REPORT — the harness writes the full markdown report
      #     to this path for the artifact below.
      - name: soak — 4 h bounded-memory profile (issue #18)
        run: |
          SOAK_MINUTES=240 SOAK_LEAK_MB_PER_H=5 SOAK_REPORT=soak-report.md \
            cargo test -p playback-engine --test soak --release -- --nocapture

      - name: Upload soak report (evidence-<job>-<os>-<run_id>; a failed soak uploads for triage too)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-soak-nightly-ubuntu-latest-${{ github.run_id }}
          path: soak-report.md
          if-no-files-found: warn # a crash before the report write still uploads nothing — the log is the evidence then

  # ---------------------------------------------------------------------
  # 8.C1 (issue #54): the scenario-suite nightly tier. Same schedule,
  # same non-blocking posture as the single-loop job above. All policy
  # (durations, cycle counts, budgets, the ASSERTED 5 MB/h target) lives
  # in tests/soak/scenarios-nightly.toml — this job is plumbing.
  # PROVEN LOCALLY (2026-11-10, sandbox, release/x86_64): the exact
  # wrapper invocation at the bounded profile
  # (tests/soak/scenarios-sandbox.toml) ran all five scenarios green
  # with reports committed under docs/soak/raw/; the enforcement path is
  # proven by the forced-threshold profile (exit 101 on a pinched
  # budget, same wrapper). NOT PROVEN: this 4 h nightly profile itself
  # (sandbox tool-call walls cap single commands below 4 h) — first
  # scheduled run is its first real execution [VERIFY].
  # ---------------------------------------------------------------------
  soak-scenarios:
    name: soak-scenarios (4 h × 5 scenarios, 5 MB/h asserted)
    runs-on: ubuntu-latest
    # 4 h of scenarios + release build + cache restore; hard stop 5 h.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch — matches rust-toolchain.toml
      - name: Assert toolchain pin (rust-toolchain.toml == action == effective rustc)
        run: |
          pin="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          inst="${{ steps.toolchain.outputs.name }}"
          eff="$(rustc --version | sed -n 's/^rustc \([^ ]*\) (.*)$/\1/p')"
          echo "rust-toolchain.toml channel : ${pin}"
          echo "workflow action installed    : ${inst}"
          echo "effective rustc              : ${eff}"
          if [ "${pin}" != "${inst}" ] || [ "${pin}" != "${eff}" ]; then
            echo "::error::toolchain mismatch - bump the dtolnay/rust-toolchain ref in .github/workflows/soak-nightly.yml to match rust-toolchain.toml, and check for a RUSTUP_TOOLCHAIN override on the runner"
            exit 1
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The wrapper (scripts/soak-scenarios.sh) is the documented
      # entry point: honest exit-code propagation, report path, and
      # the profile selection. --release matches the tier the 4 h
      # numbers describe (the sandbox evidence is release).
      - name: soak scenarios — 4 h profile, 5 MB/h asserted (issue #54 / 8.C1)
        run: |
          scripts/soak-scenarios.sh --profile tests/soak/scenarios-nightly.toml --release --report soak-scenarios-report.md

      - name: Upload scenario-suite report (a failed suite uploads for triage too)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-soak-scenarios-nightly-ubuntu-latest-${{ github.run_id }}
          path: soak-scenarios-report.md
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # 8.C1 (issue #54): LeakSanitizer nightly. Doc 10 §6.5 — "nightly
  # LeakSanitizer run of parser crates on linux [PROPOSAL — needs
  # nightly toolchain component]".
  #
  # HONESTY NOTES (this job has NEVER EXECUTED — CI billing-blocked,
  # docs/KNOWN-LIMITS.md R-16):
  #   * -Z sanitizer=leak is unstable-only, hence the NIGHTLY toolchain
  #     here — the ONLY job in the repo deliberately off the stable pin;
  #     that is why it does not run the toolchain-pin assert step. The
  #     action ref stays commit-pinned (same SHA as the other jobs); a
  #     moving `nightly` channel is accepted for this job and noted
  #     here [VERIFY on first run].
  #   * NOT runnable in the dev sandbox either: no nightly toolchain
  #     installed and the shared target dir cannot fit a second,
  #     sanitizer-flagged rebuild of the dep graph. The command SHAPES
  #     (cargo test package selection, the scenario-suite env contract)
  #     are the ones proven green unflagged at CI-short scale; the
  #     flagged behavior itself is [VERIFY on first run].
  #   * Known LSAN false-positive surface: RUSTFLAGS applies to build
  #     scripts and proc-macros too, and a build script that exits
  #     without freeing heap memory reports as a leak. If that bites,
  #     add an LSAN_OPTIONS suppression file in-repo and set
  #     LSAN_OPTIONS=suppressions=lsan-suppressions.txt here — do NOT
  #     delete the job.
  #   * Leak reports exit non-zero by default (LSAN exitcode 23
  #     wrapped by cargo's 101) — a red run here is a finding for
  #     triage within 24 h, same posture as the other soak jobs.
  # ---------------------------------------------------------------------
  soak-lsan:
    name: soak-lsan (LeakSanitizer, nightly toolchain [PROPOSAL])
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: "-Z sanitizer=leak"
      LSAN_OPTIONS: "detect_leaks=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # same pinned action; nightly input below
        with:
          toolchain: nightly
      - name: Report the nightly toolchain (deliberately off the stable pin — see job header)
        run: rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Step 1 — the parser + engine crates' own suites (doc 10 §6.5
      # "parser crates"): demux, codecs, playlists, streaming,
      # media-probe, input, then playback-engine's unit library.
      - name: LSAN — parser + engine crate suites
        run: cargo test -p demux -p codecs -p playlists -p streaming -p media-probe -p input -p playback-engine --lib

      # Step 2 — the integrated engine stack under leak detection:
      # the CI-short scenario profile (tests/soak/scenarios.toml, ~1
      # min debug) drives open/play/seek/playlist/close through the
      # real access → demux → decode → sink path.
      - name: LSAN — soak scenario suite (CI-short profile)
        run: |
          SOAK_SCENARIOS=tests/soak/scenarios.toml \
            cargo test -p playback-engine --test soak_scenarios -- --nocapture
