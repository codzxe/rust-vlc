  # -{78}

  # --------------------------------------------------------------------------
  # G3/G4 dependency & advisory gate (doc 10 §4.6; doc 11 §3.2, §3.5).
  # Activated by 1.E5-R together with deny.toml; was a [STUB] before.
  # BLOCKING: continue-on-error: false + the real checks below — now that
  # it is live, add it to the repository's required checks (Lead wiring
  # call; the stub's "do not add until activated" note is retired).
  # Per doc 11 §3.5 this gate is INDEPENDENT of the build/test matrix
  # (a failing audit must never be masked by green tests).
  #
  # cargo-deny is not installed via a (composite) action on purpose: the
  # upstream release tarball is downloaded and SHA-256-verified, matching
  # the doc 11 §3.7 pinning posture (no floating tool installs in CI):
  #   cargo-deny 0.20.2
  #   tarball cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
  #   sha256 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  #   tag 0.20.2 dereferences to commit bca0dde53651ee946720e4540b5ce2610bec8f06
  #     (git ls-remote refs/tags/0.20.2^{}, re-verified 2026-10-20)
  # A toolchain is still required: cargo-deny shells out to
  # `cargo metadata` to build the crate graph.
  # --------------------------------------------------------------------------
  cargo-deny:
    name: cargo-deny (G3/G4 — licenses/sources/bans/advisories)
    continue-on-error: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch — matches rust-toolchain.toml
      - name: Assert toolchain pin (rust-toolchain.toml == action == effective rustc)
        run: |
          pin="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          inst="${{ steps.toolchain.outputs.name }}"
          eff="$(rustc --version | sed -n 's/^rustc \([^ ]*\) (.*)$/\1/p')"
          echo "rust-toolchain.toml channel : ${pin}"
          echo "workflow action installed    : ${inst}"
          echo "effective rustc              : ${eff}"
          if [ "${pin}" != "${inst}" ] || [ "${pin}" != "${eff}" ]; then
            echo "::error::toolchain mismatch - bump the dtolnay/rust-toolchain ref in .github/workflows/ci.yml to match rust-toolchain.toml, and check for a RUSTUP_TOOLCHAIN override on the runner"
            exit 1
          fi
      - name: Install cargo-deny 0.20.2 (SHA-256-pinned release binary)
        run: |
          cd "${RUNNER_TEMP}"
          curl --proto '=https' --tlsv1.2 -sSfL -o cargo-deny.tar.gz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz
          install -m 0755 "cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny" "${HOME}/.cargo/bin/cargo-deny"
          cargo deny --version
      - name: cargo deny --workspace check (doc 11 §3.2/§3.5 — G3 licenses/sources/bans + G4 advisories)
        run: cargo deny --workspace check licenses sources bans advisories
