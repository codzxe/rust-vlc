# Lumen — workspace root manifest (task 1.A1).
#
# Membership policy (agreed plan, recorded in worklog 1.A1):
# * `members = ["crates/*"]` — later agents add crates by creating
#   `crates/<name>/` WITHOUT editing this file (wave conflict-rule avoidance).
# * `crates/_template` (package `template`) is intentionally a MEMBER:
#   - cargo rejects an all-excluded workspace: `cargo check --workspace` fails
#     with "the manifest is virtual, and the workspace has no members";
#   - an excluded crate cannot resolve `[lints] workspace = true` at all
#     ("error inheriting `lints` ... failed to find a workspace root").
#   Membership keeps the template check/test/lint-clean as the workspace grows.
#   It is `publish = false`; no crate may ever depend on it.
# * Card 1.A3 (xtask v0) appended "tools/xtask" to `members` — the single
#   pre-announced post-1.A1 edit of this file (worklog 1.A1). Cards 2.D2
#   and 2.D3 (merged concurrently, wave 2.D) appended the "apps/*" glob
#   together: apps/cli (the first L6 app, Lead-assigned scope "apps/cli/**,
#   workspace member") and apps/desktop (the webview-prototype skeleton).
#   apps/web (7.H1) joins later by creating `apps/<name>/` WITHOUT editing
#   this file. Card 2.E1 (the first integration-suite crate — doc 10 §6.1's
#   `tests/integration/` level) appended the explicit member path
#   "tests/integration/first-vertical": the same pre-announced single-edit
#   pattern as tools/xtask, and exactly that card's granted scope (a root
#   `tests/` directory is NOT a workspace member by default, so the suite
#   declares its package explicitly to join the gate's
#   `cargo test --workspace` — doc 10 §6.1: integration scenarios are
#   merge-blocking). [PROPOSAL: promote to a "tests/integration/*" glob
#   when the second suite (contract/stress/compatibility) lands, mirroring
#   crates/* — Lead decision]. Further membership changes require Lead
#   approval (AGENTS.md §3.7).
#
# Lint policy: doc 10 §3.1 verbatim (rust + clippy deny lists). Every member
# inherits it via `[lints] workspace = true` (doc 10 §3.2). Inheritance is
# proven by the canary in `crates/_template/src/lint_canary.rs`.

[workspace]
resolver = "2"
# Single-line members array: the xtask TOML reader (check-architecture)
# does not support multi-line arrays — the salvage's multi-line form
# broke the arch gate; restored to the reader's shape with the same
# membership (the 2.E1 pre-announced edit, unchanged in content).
members = ["crates/*", "apps/*", "tools/xtask", "tests/integration/first-vertical", "tools/mem-audit", "tools/sweep"]
# ADR-004 admission (issue #67, 2026-11-13): the tauri webview crate is
# EXCLUDED — `apps/*` would otherwise pull it into every workspace lane
# (with --all-features flipping its would-be feature on everywhere and
# dragging webkit2gtk + a built ui/dist into the main graph). Its own
# lockfile (apps/desktop-tauri/Cargo.lock) carries the tauri closure;
# its dedicated CI lanes compile it on webview-equipped hosts. An
# excluded crate cannot resolve [lints] workspace = true (the note
# above) — the policy is mirrored inline in its Cargo.toml. Lead
# decision with the ADR-004 record (records/tauri-wry-2.x.md).
exclude = ["apps/desktop-tauri"]

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unused_imports = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
await_holding_lock = "deny"
