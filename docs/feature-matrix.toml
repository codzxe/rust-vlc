# =============================================================================
# docs/feature-matrix.toml — THE parity ledger (MASTER-PROMPT §1)
# =============================================================================
# "Parity is the share of inventory features in docs/feature-matrix.toml that
# are verified by automated evidence." This file is the single source of truth
# for feature status across platforms. CI validates it TODAY via the inline
# python3 structural check in the schema-validation job (card 1.E2, stdlib
# tomllib): R9 parse + meta, top-level shape, per-row required keys, R1
# id-regex/uniqueness, R2 ranges, R3 platform columns + vocabulary, R4/R5/R6
# conditionals — proven against seeded violations (worklog 1.E2). The full
# tools/feature-audit (R1 category-prefix map, R2-P0 rule, R4 evidence
# resolution, R7 config cross-check, R8 inventory completeness, R10
# anti-hallucination) is OWED and unassigned debt — doc 13 card 5.Q1 wires
# its coverage gates (doc 02 §4.6). It couples to config (MP §5): feature
# exposure lists only implementations that exist — config can never enable a
# missing codec, protocol or hardware capability.
#
# SCHEMA FROZEN 2026-10-19 (doc 02 §4.7).
#   Any later change to fields, categories, statuses, prefixes or validation
#   rules requires Lead change-control: (1) Lead-approved proposal,
#   (2) meta.schema_version bump, (3) migration note appended to
#   docs/inventory/matrix-seed-notes.md. Rows are append-mostly; status changes
#   require new evidence (R4) and are audited in git history. Parity
#   percentages are computed by the tool, never stored.
#
# Population: Task 0.D2 (Phase 0) from the completed inventories —
#   docs/inventory/{formats.json, modules-linux.json, options-linux.json,
#   options-summary.md, modules-summary.md, ui-inventory.md} and the
#   feasibility verdict tables (docs/feasibility/sections/). Population log,
#   grouping decisions, not-adopted list and open questions:
#   docs/inventory/matrix-seed-notes.md.
# =============================================================================

[meta]
schema_version = 1                 # frozen 2026-10-19; bump = Lead change-control
schema_frozen = "2026-10-19"
baseline = "VLC 3.0.23 Vetinari (3.0.23-2-0-g79128878dd)"
last_updated = "2026-10-22"
populated_by = "0.D2 (Phase 0 synthesis)"
change_control = "Lead-only per doc 02 §4.7"

# -----------------------------------------------------------------------------
# STATUS VOCABULARY — per-platform values (doc 02 §4.3; MP §17 + §10)
# -----------------------------------------------------------------------------
#   not_started  no work yet (the honest Phase 0-exit default; nothing in this
#                file is verified — no CI exists yet)
#   in_progress  active work
#   implemented  code complete on that platform, evidence not yet complete
#   verified     specified + complete incl. error paths + tested on every
#                CLAIMED platform + documented limits + non-regressing.
#                REQUIRES `evidence` (R4). Transitions are audited:
#                not_started → verified jumps are REJECTED (anti-fabrication;
#                the tool decides from evidence — agents never self-verify,
#                MP §15).
#   partial      a documented subset works — REQUIRES `notes`; P0 rows may not
#                stay partial past their target phase without Lead sign-off
#   unsupported  intentionally out of scope on that platform (by-design
#                replacement or platform limit) — REQUIRES `blocked_reason`
#   blocked      external blocker (dependency, hardware, legal) — REQUIRES
#                `blocked_reason` citing a feasibility §/ADR/risk-register
#                entry, with alternatives considered and a next step (MP §17)
#
#   NOTE: doc 13's `not-selected` is a wave-CARD status for closed
#   decision-pair alternatives (e.g. the Phase 2 demuxer variant that does not
#   execute) — it is NOT a matrix status. Matrix wont-do rows use
#   `unsupported` (by-design) or `blocked` (external), always with a reason.
#
# -----------------------------------------------------------------------------
# PLATFORM COLUMNS — exactly these four keys on every row (R3)
# -----------------------------------------------------------------------------
#   windows / linux / macos   the three desktop CI platforms (MP §13)
#   web                       DEDICATED column (MP §10): the WASM/webview
#                            target is a first-class platform sharing the same
#                            command layer; a dedicated column forces
#                            per-platform honesty instead of footnotes.
#   Platform-specific rows (e.g. a WASAPI output, a WebCodecs path) carry
#   `unsupported` on the not-applicable columns with the reason in
#   blocked_reason (doc 02 §4.5 pattern).
#
# -----------------------------------------------------------------------------
# EVIDENCE-LINK RULES (R4/R5/R6; MP §13/§17)
# -----------------------------------------------------------------------------
#   - `evidence` is "" everywhere at Phase 0 exit: no CI exists yet, therefore
#     NOTHING is verified and nothing is implemented. Any future `verified`
#     status REQUIRES evidence resolving to an existing artifact recording
#     commands + actual results (or a our-CI run URL); mock evidence must be
#     labeled mock (MP §13).
#   - `blocked`/`unsupported` REQUIRES `blocked_reason` referencing an
#     existing doc section / ADR / risk entry.
#   - `partial` REQUIRES `notes` describing the working subset.
#   - Config cross-check (R7, MP §5): product feature-exposure lists,
#     profiles, keymaps and layouts may reference only matrix ids with a
#     non-not_started implementation on that platform — no
#     enable-without-implementation, ever.
#
# -----------------------------------------------------------------------------
# VALIDATION RULES — what tools/feature-audit will enforce (doc 02 §4.6);
# manual checklist until Phase 1 wave 1.E lands it
# -----------------------------------------------------------------------------
#   R1  id unique; regex ^[a-z0-9]+(-[a-z0-9]+)+$; id prefix matches category
#       (category→prefix map: docs/inventory/matrix-seed-notes.md §2)
#   R2  category / priority / phase_target in range; P0 ⇒ phase_target ≤ 6
#       [PROPOSAL — see seed-notes open question Q3 for the one tension]
#   R3  status has exactly windows/linux/macos/web; values in the vocabulary
#   R4  any verified ⇒ evidence resolves (rules above)
#   R5  any blocked/unsupported ⇒ blocked_reason non-empty + doc/ADR/risk ref
#   R6  any partial ⇒ notes non-empty (working subset described)
#   R7  config cross-check with tools/config-validator (MP §5)
#   R8  inventory completeness: everything discovered in doc 02 §3 has a row
#       (including explicit wont-do rows); per-category counts reconcile with
#       the inventories; no silent omissions
#   R9  file parses as TOML; meta.schema_version present; CI merge-blocking
#   R10 anti-hallucination: every VLC-derived row carries inventory_ref +
#       vlc_name tracing to docs/inventory/; no invented VLC features
#
# PHASE TARGETS (MP §16 / doc 13): 2 first vertical · 3 reliable engine ·
#   4 desktop product · 5 breadth · 6 network & streaming · 7 platform &
#   advanced · 8 hardening/release. Semantics: earliest phase with planned
#   work; 8 also parks later/post-v1 rows; blocked rows keep their revisit
#   phase. P0 formats must target ≤ 6 (R2 [PROPOSAL]).
# -----------------------------------------------------------------------------

