# --- engine (doc 07 §5.4 engine-internal entries: ui = false, CLI + docs +
#     validation only, never rendered — the escape valve that keeps VLC-style
#     hidden power options honest: same schema, same D-rules, still in --help) --

[[setting]]
key = "engine.log-level"
type = "enum"
enumeration = ["error", "warn", "info", "debug", "trace"]
default = "info"
description = "settings.engine.log-level"
restart_required = false
placement = { screen = "engine", section = "internal", order = 10, ui = false }
cli = { flag = "--engine-log-level", short = "" }
