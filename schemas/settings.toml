# ============================================================================
# schemas/settings.toml — the Lumen settings schema (doc 07 §5).
#
# The single source of truth for every setting (type, range, description
# msgid, restart-required, UI placement, CLI flag, feature gate, since).
# Everything else is GENERATED from this file and committed for review:
#   schemas/generated/settings.d.ts        (G1 — TS types)
#   schemas/generated/settings-help.txt    (G2 — CLI --help)
#   schemas/generated/settings-docs.md     (G3 — docs page)
# plus the runtime validator (G4) embedded in crates/settings-schema.
# Regenerate with `cargo xtask schema-gen`; a second run is byte-identical.
#
# Entry format: doc 07 §5.2 — every [[setting]] carries the ten mandated
# fields: key, type, range/enumeration, default/default_ref, description,
# restart_required, placement, cli.flag, feature_gate, since. Single-
# definition rules D1–D6 (doc 07 §5.2) are enforced by the validator:
#   D1 default xor default_ref; default_ref targets must exist in product.toml
#   D2 setting keys globally unique
#   D3 CLI flags globally unique and disjoint from reserved CLI names
#   D4 description msgids unique 1:1 with entries
#   D5 placement orders unique per (screen, section); screens must be known
#   D6 no two entries write the same product-decision slot (default_ref)
#
# PHASE-1 SCOPE (card 1.B2): entries mirror the decisions that ACTUALLY
# exist today — the product.toml options documented in doc 07 §2 (window,
# defaults, telemetry, playback, limits) plus the engine-internal entries
# named in doc 07 §5.4. The fuller doc 07 §5.4 seed (~45 entries) arrives
# with the settings framework (card 4.E1); the VLC-scale census is a later
# phase. The structure already scales to it (arrays of flat entries).
#
# Naming (doc 07 §5.2): setting keys are kebab-case dotted ids; default_ref
# paths use the product.toml snake_case spelling — the D1 check joins them.
# ============================================================================

# Known settings screens (doc 07 §5.4: the 13 design-package areas, plus
# `engine` for ui = false entries). [MIGRATION NOTE] this seeds the screen
# registry that doc 07 §5.4/§7.2 assigns to layouts/settings-areas.toml;
# when that file lands, schema-gen reads screen ids from it instead.
# Order = the W26 Figma Settings sidebar (App 4 · Media 5 · System 4,
# Settings - *.svg frames; analysis tools-settings.md D2/D3) so the
# generated area order needs no registry re-sort (w26.b02).
[areas]
known = [
    "global", "interface", "privacy", "controls",
    "playback", "video", "audio", "subtitles", "library",
    "network", "performance", "recording", "extensions",
    "engine",
]

# --- global -----------------------------------------------------------------

[[setting]]
key = "global.language"
type = "enum"
enumeration = ["en-US"]        # [VERIFY] dynamic locales/ listing (doc 07 §5.4)
default_ref = "defaults.locale"
description = "settings.global.language"
restart_required = true
placement = { screen = "global", section = "language", order = 10, ui = true }
cli = { flag = "--global-language", short = "" }
feature_gate = ""
since = "0.1.0"

