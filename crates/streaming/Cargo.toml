# crates/streaming — network streaming layer (card 6.A1a; doc 13 §9).
#
# Registry: the `streaming` crate of doc 01 §2.4 (layer L2). v0 scope is
# the *port* only: the sync `HttpFetch` trait + request/response types,
# the typed network error vocabulary, and a std-only mock HTTP/1.1
# testkit. The real HTTP client (ureq admission, 6.A1b/6.A1c), ranged
# seekable resources (6.A2), HLS/DASH (6.B/6.C) and RTSP (6.G) land on
# top in later cards.
#
# C5 discipline: std-only, zero external dependencies. Sync-only per
# doc 01 §4.2 (engine core is threads + channels — no async runtime).
# No unsafe, no unwrap/expect/panic (workspace lints), bounded response
# memory (MP §12 — `HttpRequest::response_limit`).
#
# Membership: joined via the root `crates/*` glob (no root manifest
# edit, per the wave conflict rule recorded there).

[package]
name = "streaming"
version = "0.1.0"
edition = "2024"
description = "Lumen network streaming layer: sync HttpFetch port, typed network errors, and a std-only mock HTTP/1.1 testkit (card 6.A1a; real client lands in 6.A1c)."
publish = false

[lints]
workspace = true

[dependencies]
# plugin-api + media-types: workspace-internal, std-only path deps
# (C5 note: the "zero external dependencies" discipline is about crates.io
# — ureq stays the only external dep; these two carry the engine's
# SourceStream/EngineError contracts that card 6.A2a's ranged resource
# must serve so demuxers consume it without knowing it is network).
media-types = { path = "../media-types" }
plugin-api = { path = "../plugin-api" }
# ureq 3.5.0 — admitted by card 6.A1b (validate-then-admit; record at
# docs/dependencies/records/ureq-3.5.0.md). Exact pin (house admission
# style): a bump re-triggers the record per doc 11 §3.7. Minimal
# feature set: rustls TLS with the compiled-in Mozilla root bundle —
# NO native-tls, NO socks-proxy, NO gzip/brotli (raw bytes preserve
# range/Content-Length semantics), NO cookies/charset/json/multipart.
# Sync by design (doc 01 §4.2). Known deviation, Lead-ADR ask: the
# rustls crypto provider is ring 0.17.14 (C + asm compiled by cc) —
# there is no production pure-Rust TLS provider; see record R1/R10.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "rustls-webpki-roots"] }

[dev-dependencies]
# testkit is dev-only by contract (MP §3.7): the lint-legal `Must`
# unwrap helper for fixture contracts (tests deny unwrap/expect/panic).
testkit = { path = "../testkit" }
# demux is dev-only here: the 6.A2a end-to-end proof serves a real WAV
# fixture over mock HTTP and demuxes it through the wav demuxer with
# RangedResource as the source stream (production streaming never links
# a demuxer; the engine composes them at the open-path card).
demux = { path = "../demux" }
