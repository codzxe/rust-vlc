# crates/platform-macos — the macOS platform adapter (card 7.A3,
# issue #40; doc 01 §2.7 L5 registry row).
#
# Registry: doc 01 §2.7 `platform-macos` (layer L5, deps: media-types,
# codec-api, audio-output, renderer-wgpu, device-discovery). This
# card's v0 surface uses the audio-output vocabulary
# (DeviceDesc/DeviceId — the seam the L4 trait layer minted, ADR-005)
# + media-types (AudioFormat); codec-api (hw decode) is issue #41,
# renderer-wgpu (wgpu import) is Lead-gated by its admission record,
# device-discovery is issue #42 — the manifest is an allowlist, those
# edges join when their cards land. Edges point downward: L5 → L4
# (audio-output) → L0 (media-types).
#
# Std-only by C5: NO external dependencies, NO objc2/core-audio
# crates — the OS C-ABIs are hand-declared `extern "C"` in
# src/macos/: CoreAudio property listening (device enumeration +
# change notifications), Metal device/layer glue, the Objective-C
# runtime (objc_msgSend typed per signature) for NSOpenPanel/
# NSSavePanel. Documented invariants per block (the MP §9 audited
# OS-service exception).
#
# Sandbox honesty: this Linux sandbox has no macOS SDK, so the FFI
# surface is compile-verified via `cargo check --target
# aarch64-apple-darwin` and `x86_64-apple-darwin` (typechecked
# declarations, no linking, no runtime); the host-runnable tests
# cover the typed seams, capability negotiation and fallbacks.
# Real-device behavior is `[VERIFY]`.

[package]
name = "platform-macos"
version = "0.1.0"
edition = "2024"
description = "Lumen macOS platform adapter: CoreAudio device enumeration + change listeners, Metal layer glue, NSOpenPanel/NSSavePanel dialogs — hand-rolled FFI, typed Unavailable fallback (issue #40, card 7.A3)."
publish = false

[lints]
workspace = true

[dependencies]
audio-output = { path = "../audio-output" }
media-types = { path = "../media-types" }

[dev-dependencies]
# testkit is dev-only by contract (MP §3.7): Must/assert_err for the
# seam + capability-negotiation acceptance tests.
testkit = { path = "../testkit" }
