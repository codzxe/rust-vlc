# The expected state-machine table (card 3.C1's committed artifact):
# one entry per (state, input) pair — 8 states x 13 inputs = 104
# entries, exactly (3.C1's four rows + 3.A3's three work-carriers). This file is the HUMAN review surface for every
# transition decision: adding, removing, or editing a row is a diff
# here, visible and arguable in TOML before it is code (the design's
# "adding a row is a deliberate act").
#
# `tests/model_check.rs` loads this file and proves the three-way
# agreement: the engine's data table (`state.rs::TRANSITIONS` via
# `apply_input`) == the imperative doc-cited oracle
# (`tests/model/oracle.rs`) == this artifact, for every pair — target,
# effects, and typed rejection reason.
#
# Grammar (a deliberately restricted TOML subset, parsed by a
# hand-rolled std-only reader in the test — playback-engine has a
# zero-external-dependency contract, C5):
#
#     [[pair]]
#     state   = "<kebab-state>"
#     input   = "<kebab-input>"
#     to      = "<kebab-state>"        # a legal row…
#     effects = ["<kebab-effect>", …]  # …with its doc 03 §4.6 side effects
#
# or, for a typed rejection:
#
#     [[pair]]
#     state  = "<kebab-state>"
#     input  = "<kebab-input>"
#     reject = "<kebab-reason>"
#
# Row count after card 3.C1: 30 legal rows, 66 typed rejections.
# Card 3.C1's four new rows (vs the 2.C2 baseline of 26/70):
#   opening + stop, buffering + pause, buffering + stop,
#   paused + primed (the buffered-pause bookend).
# The close-from-active trio (buffering/playing/paused + close) is
# typed `settle-first`: the wire (doc 05 §3.3) has no active->idle
# edge; the executor composes stop-then-close (`close_plan`).

