# crates/codecs — builtin software codec implementations (card 2.B4,
# doc 01 §2.5 registry row: L3, deps codec-api + plugin-api + media-types).
#
# This card's surface — the MJPEG (baseline JPEG) video decoder — needs
# codec-api + media-types only. plugin-api joins when the registry/plugin
# surface lands (doc 01 §2.5(b) `register()`); the boundary manifest is an
# allowlist, so the narrower dep list is legal (boundaries.toml mirrors it
# exactly, video-engine precedent).
#
# Std-only at 2.B4/2.B5; the Phase-5 FLAC card (5.A1) adds the FIRST external
# engine dependency under the Lead's C5 conditional approval:
# `claxon` — purity-verified in docs/dependencies/records/claxon-0.4.3.md
# (F1-F7 all NO, zero normal dependencies, Apache-2.0, sha256-pinned; the
# historical RUSTSEC-2018-0004 advisory is outside the pinned range).
# Exact pin per doc 11 §3.7: a bump re-triggers the record.
#
# `decoders` feature: v0 shipped the mjpeg module unconditionally; per-codec
# Cargo features of doc 01 §2.5(a) arrive with the registration card (R3) —
# flac rides the crate unconditionally for now, like pcm.

[package]
name = "codecs"
version = "0.1.0"
edition = "2024"
description = "Lumen builtin software codecs: baseline-JPEG/MJPEG video decoder, unpacked-PCM audio decoder and FLAC audio decoder (claxon engine) behind the codec-api contract (doc 01 §2.5, cards 2.B4/2.B5/5.A1)."
publish = false

[lints]
workspace = true

[dependencies]
codec-api = { path = "../codec-api" }
media-types = { path = "../media-types" }
claxon = "=0.4.3"
# 5.A3 (Lead pre-approval, C5): the MP3/MP2/MP3 decode engine. Purity
# verified in docs/dependencies/records/symphonia-mp3-0.6.1.md BEFORE
# this edit; the metadata/ID3/Xing/VBRI/seek surface stays ours.
symphonia-bundle-mp3 = "=0.6.1"
# Direct edge to the engine's core (same pinned version; the node is
# already in the graph transitively — the direct edge adds NO new
# packages, it only names the types our glue code touches).
symphonia-core = "=0.6.1"
# 5.B2 (Lead pre-approval, C5): the Vorbis decode engine. Purity
# verified in docs/dependencies/records/symphonia-vorbis-0.6.1.md BEFORE
# this edit; the identification/comment-header parsing, granule
# arithmetic and seek surface stay ours. (The brief's assumed
# `symphonia-bundle-vorbis` spelling does not exist on crates.io — the
# 0.6.1 train's Vorbis crate is `symphonia-codec-vorbis`; the record's
# R1 explains. Adds 4 lock nodes: -codec-vorbis, -common, -metadata,
# regex-lite.)
symphonia-codec-vorbis = "=0.6.1"
# 5.C2a (Lead pre-approval, C5): the AAC-LC decode engine. Purity
# verified in docs/dependencies/records/symphonia-aac-0.6.1.md BEFORE
# this edit; the ADTS header parse + error taxonomy stay ours. (The
# brief's `symphonia-bundle-aac` spelling does not exist on crates.io —
# the record's reality check.)
symphonia-codec-aac = "=0.6.1"
# 5.J3a (Lead pre-approval, C5): the ALAC decode engine. Purity
# verified in docs/dependencies/records/symphonia-alac-0.6.1.md BEFORE
# this edit; the ALACSpecificConfig parse + error taxonomy stay ours.
# Adds exactly 1 lock node (log/common/core all shared with the
# siblings — the record's R2).
symphonia-codec-alac = "=0.6.1"
# 5.E1 (Lead pre-approval, C5): the AV1 decode engine — rav1d, the
# Rust port of dav1d. Purity verified in
# docs/dependencies/records/rav1d-1.1.0.md BEFORE this edit; the
# record's whole point: `asm` is DEFAULT-ON (cc/nasm-rs compile the
# shipped .S/.asm), so this admission pins
# `default-features = false` + the two pure-Rust bitdepth features.
# The record's R3 sabotage build (CC=/nonexistent-cc) proves build.rs
# is inert with asm off. The OBU temporal-unit framing, error
# taxonomy and codec-api contract surface stay ours.
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# 6.M-opus (Lead admission, docs/dependencies/records/ruopus-0.1.2.md):
# the Opus decode engine. Purity verified in the record BEFORE this
# edit (pure Rust, SIMD-kernel unsafe only, no build.rs, no FFI).
# Binding condition 1 (non-negotiable): default features are OFF and
# ONLY `std` is enabled — the default feature set drags in a
# 23-package spectrogram/ndarray graph and the `python` feature pulls
# pyo3; with this pin `cargo tree -p ruopus` prints exactly one node
# (zero normal dependencies). Exact pin per the record's honest gap 1
# (young release line — a bump re-triggers the record). The OpusHead
# parse/validation, pre-skip/end-trim granule arithmetic and error
# taxonomy stay ours.
ruopus = { version = "=0.1.2", default-features = false, features = ["std"] }

[dev-dependencies]
# The randomized-corpus vertical (ED-FIX-5; user directive 2026-10-22):
# the corpus suite opens real ffmpeg-authored AVIs through `input`'s
# FileAccess and demuxes them with the real `AviDemuxer` before decoding —
# the full L1→L3 composition under test, no synthetic fixture anywhere in
# the path. Downward dev-edges only (the demux dev-dep precedent).
input = { path = "../input" }
demux = { path = "../demux" }
plugin-api = { path = "../plugin-api" }
testkit = { path = "../testkit" }
