# crates/playlists — M3U playlist reading/writing (card 4.D1).
#
# Layer: application-support, no internal deps yet (the queue semantics that
# will consume this crate land with 4.C2's panel work). Std + thiserror only
# — the same dependency family settings-schema/localization/plugin-api use
# (thiserror 2.x is already in the workspace lockfile; no new dependency).

[package]
name = "playlists"
version = "0.1.0"
edition = "2024"
description = "Lumen playlist support: extended/plain M3U parsing (dirty-world tolerant, D-1/D-2) and canonical writing with pinned roundtrip stability (card 4.D1)."
publish = false

[lints]
workspace = true

[dependencies]
thiserror = "2"

[dev-dependencies]
# Intentionally empty: the fuzz-lite harness is a deterministic inline RNG
# (splitmix64), matching the repo's no-proptest status quo.
