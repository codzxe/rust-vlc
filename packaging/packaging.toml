# ============================================================================
# packaging/packaging.toml — the packaging plane of Lumen (issue #56,
# cards 8.E1–8.E3; task W24-C, wave 24 lane C).
#
# Single source of truth for PACKAGING decisions, companion to
# product.toml (which stays the single source of truth for PRODUCT
# identity — name, version, publisher, per-OS identifiers, MSI
# UpgradeCode, brand accent). This file owns everything rule 3 of the
# packaging card lists that is a packaging decision rather than a
# product one: install dirs, shipped-file lists, checksum algorithm,
# signing postures/secret names, desktop-entry categories, launch-test
# verbs. Validated against packaging/packaging.schema.json by
# scripts/packaging/packaging-env.py at every use; a violation is a
# hard error, never a silent fallback.
#
# Product identity NEVER appears here — it is read from product.toml by
# scripts/release/product-env.py and re-exported by packaging-env.py so
# every packaging script sees one merged, literal-free environment.
# ============================================================================

schema_version = 1

# --- Checksums (8.E3, doc 11 §9.3 item 6) -----------------------------------
# The release manifest algorithm and file name. SHA-256 is the only
# wired algorithm (schema enum); the manifest lists every artifact
# BEFORE the manifest itself is written, so it never hashes itself.
[checksum]
algorithm = "sha256"
manifest_name = "SHA256SUMS.txt"

# --- SBOM (8.E3, doc 11 §9.3 item 1) ----------------------------------------
# Per-artifact-set CycloneDX SBOM wiring. Content is generated by
# `cargo run -p xtask --locked -- sbom --out <path>` (the wave-23
# std-only CycloneDX 1.5 generator) and is lockfile-derived, hence
# byte-identical across platforms; each artifact set carries its own
# copy so every release download is self-contained.
[sbom]
spec_version = "1.5"
artifact_suffix = "sbom.cdx.json"

# --- Shipped files -----------------------------------------------------------
# Repo-relative files that ride in EVERY package. The two binaries are
# NOT listed here: their names come from cargo metadata via
# product-env.py (BIN_CLI / BIN_DESKTOP), so a bin rename needs no
# packaging edit. Docs listed here are staged with 0644.
[shipped]
docs = ["LICENSE", "README.md"]

# --- Desktop entry (deb / rpm / AppImage share one generated file) -----------
# Values per the freedesktop spec; config-driven so a product decision
# to re-categorize touches this file only.
[desktop_entry]
categories = "AudioVideo;Video;Player;"
terminal = false

# --- Linux (8.E3) -------------------------------------------------------------
# FHS install dirs for the deb and rpm (staging-relative, no leading
# slash). rpm License: mirrors the repo LICENSE (MIT) as an SPDX id.
[linux]
install_bindir = "usr/bin"
docs_dir = "usr/share/doc"
applications_dir = "usr/share/applications"
icons_dir = "usr/share/icons/hicolor/512x512/apps"
deb_section = "video"
rpm_release = "1"
rpm_license = "MIT"

# --- macOS (8.E2) -------------------------------------------------------------
# Universal-binary DECISION (documented in docs/packaging/README.md):
# v1 ships two single-arch .app/.dmg artifact sets (aarch64 on
# macos-latest, x86_64 on the macos-*-intel family) instead of one
# universal2 binary — honest sizing: the engine is the same code either
# way, a universal binary doubles every download for the price of one
# artifact, and Apple-silicon hosts run x86_64 builds through Rosetta 2.
# Both rust targets below stay known to the repo so a future
# universal2 build (lipo of the two) is a config flip plus a docs
# update, not archaeology.
[macos]
universal = false
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

# --- Windows (8.E1) -----------------------------------------------------------
# install_bindir is relative to ProgramFiles64Folder\<Product Name> in
# the MSI layout (the directory name itself is identity.name and comes
# from product.toml through gen-wxs.sh — never from here).
# upgrade_test: whether the release workflow runs the MSI upgrade-path
# test (scripts/packaging/test-msi-upgrade.ps1) on the Windows runner.
[windows]
install_bindir = "bin"
upgrade_test = true

# --- Launch test (8.E1–8.E3 "packages launch-tested per platform") ------------
# How a packaged engine binary proves it launches and decodes:
#   <bin> <version_flag>            -> exit 0
#   <bin> <smoke_verb> <fixture>    -> exit 0, one BENCH line (real
#                                      open-path + decoder drive)
# The desktop binary's packaged contract is its documented skeleton
# notice + exit code 86 (apps/desktop/src/main.rs WEBVIEW_PENDING) —
# asserted as-is, never faked.
[launch_test]
version_flag = "--version"
smoke_verb = "decode-bench"
smoke_fixture = "tests/fixtures/generated/valid/wav_pcm_s16le_44k1_st.wav"
desktop_pending_exit = 86

# --- Signing (8.E1 / 8.E2; doc 11 §9.3 item 6) --------------------------------
# Both lanes are EXTERNALLY BLOCKED on user-owned credentials:
#   * Windows: Authenticode certificate not budgeted (card 8.E1
#     "[VERIFY] — escalate if absent"; owner = user).
#   * macOS:   no Apple Developer account (risk register R-35, open,
#     User-decision; owner = user).
# The scripts below are real signtool/codesign/notarytool drivers: with
# the secret env vars set they sign and notarize; without them they
# write an explicit .UNSIGNED.txt sidecar (never silently pretend) and
# the workflow prints a ::warning:: carrying the blocker id + next
# step. Secret ENV NAMES live here so no packaging script carries a
# secret-name literal either.

[signing.windows]
timestamp_url = "http://timestamp.digicert.com"
pfx_b64_env = "WINDOWS_SIGNING_PFX_B64"
pfx_password_env = "WINDOWS_SIGNING_PFX_PASSWORD"

[signing.macos]
# codesign: either a preinstalled keychain identity name, or a base64
# PKCS#12 imported into a scratch keychain on the runner.
identity_env = "MACOS_SIGNING_IDENTITY"
p12_b64_env = "MACOS_SIGNING_CERT_P12_B64"
p12_password_env = "MACOS_SIGNING_CERT_PASSWORD"
# notarytool: App Store Connect API-key mode (the CI-appropriate mode;
# no interactive Apple-ID prompts). Key content is the .p8 private key
# in PEM form; Apple requires the file to be named
# AuthKey_<key-id>.p8 for `notarytool --key` use.
notary_key_id_env = "APPLE_API_KEY_ID"
notary_key_b64_env = "APPLE_API_KEY_B64"
notary_issuer_env = "APPLE_API_ISSUER"
