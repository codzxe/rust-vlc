[sources]
# crates.io only: no git dependencies, no private/alternate registries
# (doc 11 §3.2 sketch; provenance is pinned via Cargo.lock + tarball
# sha256 checks in the audit records instead).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
