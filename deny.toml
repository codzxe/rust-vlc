    "gstreamer-webrtc",
    # gstreamer-*-sys FFI layer (gstreamer-utils-sys 404s on crates.io
    # as of 2026-10-20 — gstreamer-utils has no -sys sibling; skipped
    # per the verify-before-ban rule, every other name below verified).
    "gstreamer-sys",
    "gstreamer-app-sys",
    "gstreamer-audio-sys",
    "gstreamer-base-sys",
    "gstreamer-check-sys",
    "gstreamer-controller-sys",
    "gstreamer-editing-services-sys",
    "gstreamer-gl-sys",
    "gstreamer-mpegts-sys",
    "gstreamer-net-sys",
