# deny.toml — cargo-deny configuration (task 1.E5-R, doc 11 §3.2).
#
# Enforced by the `cargo-deny` CI job (.github/workflows/ci.yml, gates
# G3/G4 per doc 10 §4.6) with cargo-deny 0.20.2 (SHA-256-pinned there):
#
#     cargo deny --workspace check licenses sources bans advisories
#
# Deviations from the doc 11 §3.2 sketch, all recorded for Lead review:
#   * The `version = 2` keys of the sketch were cargo-deny's v1→v2 config
#     migration markers; cargo-deny 0.20.2 no longer accepts them (the
#     `cargo deny init` template for 0.20.2 has no version fields), so they
#     are omitted here.
#   * `licenses.allow` is the MINIMAL SET the current Cargo.lock needs
#     (verified against every locked crate's SPDX via the crates.io API,
#     2026-10-20, evidence in tmp/preaudit-e5r/). cargo-deny warns on
#     allowed-but-never-encountered licenses, so admitting a new license
#     class (e.g. MPL-2.0 for a future crate) requires a same-PR edit of
#     this file — that review friction is deliberate [PROPOSAL: minimal-set
#     posture per 1.E5-R assignment; the doc 11 sketch's wider list
#     (BSD/ISC/Zlib/CC0/MPL-2.0/…) is re-added crate-by-crate when a
#     locked crate actually needs it].
#   * `bans.deny` entries are bare crate names (the 0.20.2 PackageSpec
#     accepts `"<name>"` or `{ crate = "<name>", reason = "..." }`; the
#     doc 11 sketch's `{ name = ... }` spelling is the older alias).
#     Every name below was verified to EXIST on crates.io (API 200,
#     2026-10-20) before banning; the single candidate that 404'd
#     (gstreamer-utils-sys) is skipped and noted in place.
#   * `licenses.private.ignore = true` skips the license check for our
#     publish=false workspace members (they carry no license field yet;
#     their license posture is decided with ADR-006, doc 11 §8.2).
#
# Honest limits (doc 11 §3.2 note): cargo-deny cannot see inside build.rs
# — it checks manifests, licenses, advisories and sources. The native-code
# ban is therefore enforced in depth: this named-crates list (what
# cargo-deny CAN see) + the F1–F7 tarball scanner (doc 11 §4.2, lands with
# the G3 checker tooling) + the tree-diff gate (doc 11 §3.6). Banning a
# wrapper's -sys crate transitively denies the facade crates that pull it.

[graph]
# The workspace root is a virtual manifest, so all members are graph roots
# already; the CI command passes --workspace explicitly anyway (it also
# guards a future move of the call into a member crate). No target filter:
# doc 11 §1.1 requires F1–F7 on every target we build, including wasm32.

[advisories]
# RustSec advisory DB (default db-urls: github.com/rustsec/advisory-db).
# yanked = "deny": a locked crate version that crates.io has yanked fails
# the check (doc 11 §3.2 sketch; G4 auto-issue flow per doc 10 §4.6).
yanked = "deny"
# Unmaintained-but-not-vulnerable advisories, each with a removal plan;
# an entry here is a documented acceptance, not a pass-through (the
# crate stays visible in every run via cargo-deny's ignore ledger).
ignore = [
    # RUSTSEC-2024-0436: `paste` 1.0.15, pulled by rav1d 1.1.0 (the
    # pure-Rust AV1 decode path, doc 11 §2.4). Informational unmaintained
    # advisory — no vulnerability; upstream solution is "No safe upgrade
    # is available". Drop this entry when a paste-free rav1d release
    # lands and Cargo.lock is bumped to it.
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 via rav1d 1.1.0: unmaintained-but-functional macro helper, no fixed upstream release; drop with the next rav1d upgrade" },
]

[licenses]
# Minimal allow set for the current lockfile (22 registry crates):
#   MIT, Apache-2.0  — serde/serde_json/serde_derive/serde_core/toml
#                      family (toml, toml_datetime, toml_parser,
#                      toml_writer, serde_spanned, winnow), thiserror
#                      family, proc-macro2/quote/syn, itoa, zmij,
#                      equivalent, hashbrown, indexmap
#   Unicode-3.0      — unicode-ident 1.0.27 "(MIT OR Apache-2.0) AND
#                      Unicode-3.0"
#   Unlicense        — memchr 2.8.3 "Unlicense OR MIT"
# GPL/LGPL deliberately absent until ADR-006 decides (doc 11 §3.2, §8.2).
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Unlicense",
    # ---- added by card 6.A1b (ureq 3.5.0 admission, 2026-10-30) --------
    # Measured license classes of ureq's minimal-feature tree that the
    # minimal set above did not cover (evidence: cargo metadata license
    # fields, recorded in docs/dependencies/records/ureq-3.5.0.md R7):
    #   ISC               — ring 0.17.14 "Apache-2.0 AND ISC",
    #                       rustls-webpki 0.103.16, untrusted 0.9.0
    #   BSD-3-Clause      — subtle 2.6.1
    #   CDLA-Permissive-2.0 — webpki-roots 1.0.11 (the Mozilla root
    #                       bundle's distribution license)
    # Lead ratifies with the merge (deny.toml is Lead-owned; the card
    # authorized the entry so the CI license gate can pass).
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    # ---- added by card W18-KK (local CI-gate verification, 2026-11-09) ----
    # License classes of the symphonia 0.6.1 + rav1d 1.1.0 trees that the
    # sets above did not cover (those crates were admitted after 1.E5-R
    # froze the minimal set, and the billing-blocked cargo-deny CI job
    # could not surface the drift; first observed in the W18-KK local
    # verification run). Evidence: `cargo metadata --locked` license
    # fields of every locked crate:
    #   MPL-2.0      — symphonia 0.6.1 family: bundle-mp3, codec-aac,
    #                  codec-alac, codec-vorbis, common, core, metadata
    #   BSD-2-Clause — rav1d 1.1.0 (pure-Rust AV1 path, doc 11 §2.4)
    #   CC0-1.0      — to_method 1.1.0 (rav1d dependency)
    # Per the minimal-set posture above, these are re-added crate-by-crate
    # now that locked crates actually need them — the doc 11 §3.2 sketch's
    # wider list already included BSD/CC0/MPL-2.0.
    "MPL-2.0",
    "BSD-2-Clause",
    "CC0-1.0",
    # ---- added by the wave-26 Lead (ADR-004 admission license classes,
    # 2026-11-13) ------------------------------------------------------
    # License classes of the desktop-tauri admission tree (tauri 2.12.5
    # + wry 0.57.2), required by the tauri-check lane's
    # `cargo deny --manifest-path apps/desktop-tauri/Cargo.toml
    # --exclude-dev check` run, which reuses this file as its config.
    # First surfaced as the two license rejections of CI run 43422427483
    # (tauri-check job, cargo-deny 0.20.2; both crates are locked in
    # apps/desktop-tauri/Cargo.lock):
    #   Zlib — foldhash 0.2.0 (dom_query -> tauri-utils -> tauri
    #          2.12.5); OSI-approved permissive, same posture as
    #          MIT/BSD (the doc 11 §3.2 sketch's wider list already
    #          included Zlib).
    #   Apache-2.0 WITH LLVM-exception — target-lexicon 0.12.16 (the
    #          wry/tauri tree); the LLVM exception grant, permissive
    #          exactly where Apache-2.0 already is.
    # The workspace-tree check does not encounter these classes (they
    # enter only through the admission subcrate), so it now carries
    # unused-allowed warnings for the pair — warnings, not errors,
    # under the minimal-set posture above.
    "Zlib",
    "Apache-2.0 WITH LLVM-exception",
]

[licenses.private]
# Workspace members are publish = false; they are not on crates.io and
# carry no license field — skipped until ADR-006 sets the repo license
# posture (doc 11 §8.2). Registry crates are still fully checked.
ignore = true

[bans]
# multiple-versions "warn" per the doc 11 §3.2 sketch; flips to "deny"
# after the first dedup pass [PROPOSAL: Lead sets the date, doc 11 §3.2].
multiple-versions = "warn"
# DEVIATION from the doc 11 §3.2 sketch (`wildcards = "deny"`): under
# cargo-deny 0.20.2 the wildcards lint also fires on intra-workspace PATH
# dependencies, which are version-less BY DESIGN here (members reference
# each other as `path = "../x"` with no version; cargo resolves them to
# the workspace member unambiguously, and the workspace is never
# published). 0.20.2 has no `allow-wildcard-paths` escape (added in a
# later cargo-deny). So: "warn" — the only two expected warnings are the
# two workspace path edges (codec-api→media-types, media-types→testkit);
# any THIRD wildcard warning is a real `*` version requirement in a
# manifest and is a review stopper. Registry pinning is enforced by the
# committed Cargo.lock + --locked CI builds + the tree-diff gate
# (doc 11 §3.6/§3.7). [Lead may re-tighten to "deny" when cargo-deny is
# bumped past the version that exempts path deps.]
wildcards = "warn"
highlight = "all"

deny = [
    # ---- doc 11 §1.1 core forbidden list (belt & braces behind F3) -------
    # FFmpeg C-library bindings: links= av* + bindgen/cc/pkg-config build
    # graph (doc 11 §2.3 rejection record: F1–F6 all fail).
    "ffmpeg-sys-next",   # zmwangx/rust-ffmpeg-sys, 9.0.1
    "ffmpeg-sys",        # meh/rust-ffmpeg-sys, 4.3.3 (unmaintained)
    # No native dynamic loading of media engines (doc 06 §6 WASM/plugin
    # host: no dlopen path into C code); libloading is the dlopen crate.
    #
    # ADR-004 admission exception (issue #67, 2026-11-13): ONE scoped
    # wrapper. libloading enters the LOCKFILE only through
    # tray-icon -> libappindicator -> libappindicator-sys (Linux tray
    # support), which is tauri's OPTIONAL `tray-icon` feature edge —
    # NOT enabled in this workspace (no trayIcon config anywhere, and
    # desktop builds with `default-features` off that path). The
    # libappindicator family dlopens the OS tray library at runtime;
    # that is the OS-shell E1 path (records/tauri-wry-2.x.md §R4), not
    # a media-engine dlopen. Any OTHER path to libloading still trips
    # the ban — this is a scoped allow, never a blanket lift.
    { name = "libloading", wrappers = ["libappindicator-sys"] },  # nagisa/rust_libloading
    # Bindings-generation implies C headers (F3 signal, doc 11 §1.1).
    "bindgen",           # rust-lang/rust-bindgen, 0.73.2

    # ---- FFmpeg/libav wrapper family (task 1.E5, doc 04 §1.2) -----------
    "ffmpeg-next",       # zmwangx/rust-ffmpeg, 9.0.0
    "ffmpeg-the-third",  # shssoichiro/ffmpeg-the-third, 6.0.0+ffmpeg-9.0
    "libav-sys",         # LucaCiucci/libav-sys, 0.2.0

    # ---- codec C wrappers per doc 04 (forbidden families) ---------------
    # Opus (pure-Rust candidate: an Opus decoder audit is a later wave).
    "opus",              # SpaceManiac/opus-rs → libopus
    "audiopus",          # lakelezz/audiopus → libopus
    "libopus-sys",       # cijiugechu/libopus_sys
    # minimp3 C decoder (pure-Rust path: symphonia's mp3 decoder, doc 04).
    "minimp3",           # germangb/minimp3-rs
    "minimp3-sys",       # germangb/minimp3-rs
    # Vorbis (pure-Rust candidate: lewton — NOT banned).
    "vorbis",            # tomaka/vorbis-rs → libvorbis/libogg
    # H.264.
    "openh264",          # ralfbiedert/openh264-rs → openh264 C
    "openh264-sys",      # saturday06/rust-openh264-sys
    "openh264-sys2",     # ralfbiedert/openh264-rs
    # AV1 (pure-Rust candidate: rav1d asm-off conditional per doc 11 §2.4
    # — rav1d itself is NOT banned here; its feature pin is an allowlist
    # concern, not a cargo-deny ban).
    "dav1d",             # rust-av/dav1d-rs → dav1d C+asm
    "dav1d-sys",         # rust-av/dav1d-rs
    # x264 (patent-encumbered encoder, doc 11 §8.3).
    "x264",              # quadrupleslap/x264
    "x264-sys",          # rust-av/x264-rs
    # VP8/VP9.
    "libvpx",            # rust-av/vpx-rs → libvpx C
    "libvpx-sys",        # DiamondLovesYou/rust-vpx
    "shiguredo_libvpx",  # shiguredo/libvpx-rs (vendored build)
    # HEVC.
    "libde265",          # andreytkachenko/libde265-rust
    "libde265-sys",      # andreytkachenko/libde265-rust
    # Subtitle rendering C stack (doc 04 §5: Rust path is our own shaping
    # via pure-Rust crates, not libass).
    "libass",            # tadeokondrak/libass-rs
    "libass-sys",        # tadeokondrak/libass-rs
    # FreeType C (font rasterization: pure-Rust path preferred).
    "freetype",          # servo/rust-freetype
    "freetype-sys",      # PistonDevelopers/freetype-sys

    # ---- GStreamer family (GLib/C plugin framework — the whole stack) ---
    "gstreamer",
    "gstreamer-app",
    "gstreamer-audio",
    "gstreamer-base",
    "gstreamer-check",
    "gstreamer-controller",
    "gstreamer-editing-services",
    "gstreamer-gl",
