id: panic-in-lib
language: Rust
severity: warning
message: >-
  Explicit panic!/assert!/unreachable in library code: reachable from
  user-controlled input. Prefer Result and checked access.
rule:
  any:
    - pattern: panic!($$$)
    - pattern: assert!($$$)
    - pattern: assert_eq!($$$)
    - pattern: assert_ne!($$$)
  not:
    inside:
      stopBy: end
      any:
        - kind: mod_item
          has:
            kind: identifier
            regex: '^tests?$'
        - kind: function_item
          follows:
            kind: attribute_item
            regex: 'test'
