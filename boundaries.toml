# Lumen architecture boundaries manifest — card 1.E1 (doc 01 §5.1).
#
# THE single source of truth for allowed workspace structure, consumed by
# `cargo xtask check-architecture` (doc 01 §5.2, CI gate G5 per doc 10 §4.6).
# The doc's proposed path `tools/xtask/src/architecture/boundaries.toml` is
# overridden by the 1.E1 card: the manifest sits at the REPO ROOT next to the
# workspace manifest it describes, so a reviewer sees both in one diff
# (Lead-ratified deviation; doc 01 §6.3 keeps the manifest Lead-reviewed).
#
# Semantics: ALLOWLIST. An edge/dep is legal only if listed here; anything
# else is a violation. Missing allowed-edges are fine (the manifest may be
# ahead of the tree). Layer numbers are doc 01 §1.4/§2: every internal
# [dependencies] edge must point downward, or be a whitelisted same-layer
# pair (see [rules].same_layer_pairs). Dev edges ([dev-dependencies]) are
# allowlisted separately and are exempt from layer ordering — doc 01's own
# design has L0 `media-types` dev-depend on the dev crate `testkit`.
#
# Updating this file: same change as the crate graph it permits, Lead review
# (doc 01 §6.1 gate 3 + §6.3 ownership map). Adding a crate without a
# `[crates.<name>]` entry FAILS the check; a stale entry for a removed crate
# fails it too.
#
# Parsed by the std-only TOML subset reader in
# tools/xtask/src/cmd/check_architecture.rs (xtask is dependency-free by
# C5): bare keys, `[a.b.c]` table headers (quoted segments allowed),
# string / integer / boolean values, single-line string arrays, `#`
# comments. Multi-line arrays and other TOML shapes are rejected loudly.

[manifest]
# Bump on incompatible manifest-shape changes; the checker accepts only 1.
version = 1

[rules]
# Doc 01 §1.4 invariant (1): whitelisted same-layer dependency pairs,
# written "from->to". plugin-api consumes the codec contract (doc 01
# §2.2 places both in L1; card 1.D2 added the edge). desktop wraps
# lumen-cli as its composition root (both L6 apps; the 6.W3 Lead
# registration backfill — the wrapper edge the skeleton always had).
# streaming->playlists (6.B1a): both L2 app-support; the HLS session
# consumes the playlist model — the composition edge, Lead-ratified.
# control-protocol->commands (7.J1): both L1; the wire protocol
# re-uses the ONE command layer's WireRequest/WireResponse envelopes
# and catalog types instead of re-implementing them (ARCH-5) — the
# same-layer composition edge, Lead-flagged in the 7.J1 worklog.
same_layer_pairs = ["plugin-api->codec-api", "desktop->lumen-cli", "streaming->playlists", "control-protocol->commands"]
# MP §3.7 / ARCH-7 (doc 01 §1.3, §2.8): these crates may appear ONLY in
# [dev-dependencies] tables — never in [dependencies] or
# [build-dependencies] of any workspace member.
dev_only = ["testkit"]
# Doc 01 §5.2 step 6 allowlist for `static mut` (crate names). Empty in
# v1: no member needs global mutable state. Doc 01 pre-lists apps/*,
# plugin-host-wasm and testkit as future candidates — add entries when
# those surfaces actually require one, with a worklog-recorded reason.
static_mut_allow = []

# ---------------------------------------------------------------------------
# Workspace members. Layers per doc 01 §2.1/§1.4; dependency lists mirror
# the crates' Cargo.tomls (source of truth read by the checker).
# ---------------------------------------------------------------------------

# L0 — core types (doc 01 §2.2). No internal deps; std-only in v1 (ARCH-1).
# testkit is correctly dev-only (MP §3.7).
[crates.media-types]
layer = 0
internal_deps = []
dev_deps = ["testkit"]
external_allowlist = []
external_dev_allowlist = []

# L1 — codec contract (doc 01 §2.4). Std-only by C5; media-types only.
[crates.codec-api]
layer = 1
internal_deps = ["media-types"]
dev_deps = []
external_allowlist = []
external_dev_allowlist = []

# L1 — plugin contract (doc 01 §2.2, card 1.D2). media-types + codec-api
# (same-layer pair whitelisted above); config-family externals only.
[crates.plugin-api]
layer = 1
internal_deps = ["media-types", "codec-api"]
dev_deps = ["testkit"]
external_allowlist = ["serde", "toml", "thiserror"]
external_dev_allowlist = []

# L1 — localization (doc 01 §2.3, card 1.B3). No internal deps.
[crates.localization]
layer = 1
internal_deps = []
dev_deps = []
external_allowlist = ["toml", "thiserror"]
external_dev_allowlist = []

# L1 — product config model (doc 01 §2.3, card 1.B1). No internal deps.
[crates.product-config]
layer = 1
internal_deps = []
dev_deps = []
external_allowlist = ["serde", "serde_json", "toml", "thiserror"]
external_dev_allowlist = []

# L1 — settings schema (doc 01 §2.3, card 1.B2). No internal deps.
[crates.settings-schema]
layer = 1
internal_deps = []
dev_deps = []
external_allowlist = ["serde", "toml", "thiserror"]
external_dev_allowlist = []

# L1 — design tokens (doc 01 §2.3, card 1.B4). No internal deps.
[crates.theme-tokens]
layer = 1
internal_deps = []
dev_deps = []
external_allowlist = ["serde_json"]
external_dev_allowlist = []

# L1 — the subtitle cue model (card 5.L2, doc 04 §5; doc 01 §2.2's
# "format-specific parsing belongs to demux/codecs/subtitles" note).
# Std-only, no deps: pure data + pure functions (cue intervals,
# positioning/alignment, style-token subset, stable wire roundtrip).
# (The 5.L2 scaffold note is history: the unified crate's real
# registration is the L2 entry below — the duplicate stale L1 block
# was removed by the Lead when check-architecture flagged it.)

# L1 — the one command layer (doc 01 §2.3, cards 1.D3 + 1.D4). Std-only
# in 1.D3; card 1.D4 adds the serde/schemars wire-form family (doc 05
# §5.1 schema-first codegen; preaudit-pass). No internal deps in 1.D4:
# doc 05 §2.2's wire types (µs Timestamp, f32 Rate, Duration::Infinite,
# pub-field ids) are deliberately distinct from media-types' engine
# vocabulary — engine-side bridging is a Phase-2 concern (worklog 1.D4).
[crates.commands]
layer = 1
internal_deps = []
dev_deps = []
external_allowlist = ["serde", "serde_json", "schemars"]
external_dev_allowlist = []

# L1 — the versioned loopback wire protocol (card 7.J1, issue #50; doc
# 01 §2.3 registry row "control-protocol"; doc 05 §5.4). In-tree
# minimal RFC 6455 WebSocket server (SHA-1/base64/frame codec/HTTP
# upgrade all std-only in-crate — ADR-011 ethos, no tungstenite/sha1/
# base64 crates), the lumen-control/1 handshake, per-start token auth,
# deny-by-default sensitive-op policy, request validation against the
# ONE command layer. `commands` is the same-layer whitelisted pair
# (see [rules].same_layer_pairs): the envelopes and catalog types are
# re-used, never re-implemented. Externals: the Lead-admitted command
# wire family only (doc 05 §5.1 — hand-rolled JSON would bypass the
# layer). Transport itself is std-only.
[crates.control-protocol]
layer = 1
internal_deps = ["commands"]
dev_deps = []
external_allowlist = ["serde", "serde_json"]
external_dev_allowlist = []

# L2 — local source access (doc 01 §2.4, card 2.A1; doc 03 §4.1).
# Implements plugin_api::Access for file sources; std-only by C5
# (no new external dependencies in this change).
[crates.input]
layer = 2
internal_deps = ["media-types", "plugin-api"]
dev_deps = ["testkit"]
external_allowlist = []
external_dev_allowlist = []

# L2 — the one playback clock (doc 01 §2.2 registry row, card 2.C1;
# doc 03 §4.7). Audio-master timing over an injected sample counter;
# observes the audio device, never drives it (ARCH-2 set: media-types
# only). Std-only by C5; testkit dev-only for the virtual-time AC.
[crates.media-clock]
layer = 2
internal_deps = ["media-types"]
dev_deps = ["testkit"]
external_allowlist = []
external_dev_allowlist = []

# L2 — bounded, generation-aware queues (doc 01 §2.2, card 2.B1; doc 03
# §4.4). The demux→decode / decode→engine stage-boundary primitive:
# std::sync Mutex + condvar MPMC (doc 03's own [PROPOSAL]: start
# simple). media-types only; std-only by C5.
[crates.packet-queue]
layer = 2
internal_deps = ["media-types"]
dev_deps = ["testkit"]
external_allowlist = []
external_dev_allowlist = []

# L2 — container demultiplexers (doc 01 §2.2 registry row, card 2.B2;
# doc 03 §4.3). v0 carries the AVI 1.0 demuxer of the first vertical
# (D-018 variant A: MJPEG+PCM). Implements `plugin_api::Demuxer` over
# `plugin_api::SourceStream` (the trait seam `input` serves — no
# compile-time edge on `input` needed, the 2.C4 Consumes-column note
# applies). Std-only by C5; testkit dev-only; `input` is a DEV edge
# (the fixture AC demuxes through the real file access stack).
[crates.demux]
layer = 2
internal_deps = ["media-types", "plugin-api"]
dev_deps = ["testkit", "input"]
external_allowlist = []
external_dev_allowlist = []

# L2 — network streaming (cards 6.A1a/A1b/A1c/A2a/A2b/A3/B1a): the
# sync HttpFetch port + ranged seekable resource + scheme registry +
# the HLS VOD session. `ureq =3.5.0` (rustls, webpki roots) is the
# 6.A1b Lead-ratified admission (record
# docs/dependencies/records/ureq-3.5.0.md; ring's C/asm the
# ADR-001-class exception). `playlists` is the B1a HLS model edge
# (the m3u8 parse lives there — one parser, no fork). `demux`/
# `input`/`codecs` are DEV edges (the e2e lanes demux and decode
# through the real stacks).
[crates.streaming]
layer = 2
internal_deps = ["media-types", "plugin-api", "playlists"]
dev_deps = ["testkit", "demux", "input", "codecs"]
external_allowlist = ["ureq"]
external_dev_allowlist = []

# L2 — playlist persistence (card 4.D1): extended/plain M3U parse +
# canonical write, dirty-world tolerant, std + thiserror only (the
# settings-schema/localization dependency family). No internal deps
# yet — the queue semantics that consume it land with 4.C2's panel
# work (the crate's own manifest note; the 6.W3 Lead registration
# backfill of the manifest the checker flagged).
[crates.playlists]
layer = 2
internal_deps = []
dev_deps = []
external_allowlist = ["thiserror"]
external_dev_allowlist = []

# L2 — bounded format detection (doc 01 §2.2 registry row, card 2.A2;
# doc 03 §4.2). Signature scoring over a bounded header window →
# ProbeReport (format id, confidence, track hints); no hit at or above
# the configured score ⇒ typed Unsupported carrying the sniffed bytes
# (MP §8). The ProbePlugin/ProbeRegistry seam consumes
# `plugin_api::SourceStream` (the trait seam `input` serves — the same
# note as demux above); `input` is a DEV edge (the fixture AC probes
# through the real file access stack). Std-only by C5.
[crates.media-probe]
layer = 2
internal_deps = ["media-types", "plugin-api"]
dev_deps = ["testkit", "input"]
external_allowlist = []
external_dev_allowlist = []

# L2 — subtitle formats + the compositing contract (doc 01 §2.2
# registry row, card 5.L1). SCAFFOLD NOTE (Lead-ratification): this
# crate does not exist on main; 5.L1 (compositing, this entry) and
# 5.L2 (cue model) both created a minimal scaffold in their own
# worktrees — Lead unifies at merge. Deps: media-types only in v0
# (the registry row also lists plugin-api, which joins with the
# SubtitleParser seam, 5.M1 — the manifest is an allowlist).
# media-clock is a DEV-ONLY edge (renderer-wgpu 2.D1 precedent): the
# sample-exact timing AC drives the REAL MediaClock end-to-end; a dev
# edge cannot leak into the public API (ARCH-7) — the library speaks
# media-types' Timestamp only. Std-only by C5.
[crates.subtitles]
layer = 2
internal_deps = ["media-types"]
dev_deps = ["testkit", "media-clock"]
external_allowlist = []
external_dev_allowlist = []

# L4 — the session orchestrator (doc 01 §2.6, card 2.C2; doc 03 §4.6 +
# §5). Owns the playback state machine, mints the two-level session
# epochs, and wires the pipeline demux→queues→decoders→sinks at the
# trait level (plugin-api Demuxer, packet-queue BoundedQueue, codec-api
# Decoder/FrameSink). NOTE (Lead flag, worklog 2.C2): doc 13's Consumes
# column lists five crates; plugin-api is required as the demux stage
# boundary (doc 01 Q3 trait placement) — L1, legal for L4 per the doc 01
# registry row "L0–L3 engine crates + commands". Std-only by C5.
[crates.playback-engine]
layer = 4
internal_deps = ["codec-api", "commands", "media-clock", "media-types", "packet-queue", "plugin-api"]
# Lead flag (card 3.A3): demux + codecs + input are TEST-ONLY edges —
# the real-fixture track-switch suite (tests/track_switch_fixture.rs)
# composes the engine with the concrete stacks exactly once, the card
# 2.B2 precedent (demux's input dev-edge) for the AC's "switch tests
# on multi-track fixtures". The library stays trait-level; dev edges
# are exempt from layer ordering by this manifest's own rules.
dev_deps = ["testkit", "demux", "codecs", "input"]
external_allowlist = []
external_dev_allowlist = []

# L3 — builtin software codecs (doc 01 §2.5 registry row, card 2.B4).
# Baseline-JPEG/MJPEG decode behind the codec-api Decoder contract. The
# registry row also lists plugin-api for the register()/manifest surface
# (doc 01 §2.5(b)); that edge joins when the plugin registry card lands —
# this card's decoder needs codec-api + media-types only (the manifest is
# an allowlist, video-engine precedent). Std-only by C5 baseline; the
# decode-engine externals below are the Lead-ratified admissions
# (each with its record; mjpeg stays in-house — 2.B4's decision).
[crates.codecs]
layer = 3
internal_deps = ["codec-api", "media-types"]
dev_deps = ["testkit", "input", "demux", "plugin-api"]
# The Lead-ratified decode-engine admissions (every one with its
# validate-then-admit record in docs/dependencies/records/ — the
# 6.W3 Lead backfill of the registration debt the checker flagged):
# claxon (FLAC), the symphonia codec family (mp3/vorbis/aac/alac —
# bundle-mp3 + core are the family's own transitive surface), rav1d
# (AV1, asm exception ADR-001-class), ruopus (Opus, 6.VTA/6.M-opus),
# rusty_vp9 (VP9, 6.VTA/6.M-vp9), filmcraft-dnx (DNxHD/DNxHR,
# 6.VTA/6.M-dnx, default-features OFF — rayon-free pin).
external_allowlist = ["claxon", "symphonia-bundle-mp3", "symphonia-core", "symphonia-codec-vorbis", "symphonia-codec-aac", "symphonia-codec-alac", "rav1d", "ruopus", "rusty_vp9", "filmcraft-dnx"]
external_dev_allowlist = []

# L3 — video presentation scheduling (doc 01 §2.2 registry row, card
# 2.C4; doc 03 §4.10). The frame scheduler: decoded-frame PTS vs the
# media-clock snapshot (present-now / wait / drop-late), the
# late-frame drop policy, the bounded in-order presentation queue and
# the Presenter trait the 2.D1 renderer implements. The registry row
# also lists plugin-api for the later video-filter chain; this card's
# surface needs media-types + media-clock only — the manifest is an
# allowlist, add the edge when the filter chain lands. Edges point
# downward: L3 → L2 (media-clock) → L0 (media-types). Std-only by C5.
[crates.video-engine]
layer = 3
internal_deps = ["media-types", "media-clock"]
dev_deps = ["testkit"]
external_allowlist = []
external_dev_allowlist = []

# L3 — the audio path after decode (doc 01 §2.2 registry row, card
# 2.C3; doc 03 §4.8). Volume, channel map, straight mix; stage-A/D
# format conversion; AudioPipeline quantum composition and the
# AudioBuffer/AudioSink seam audio-output implements. The registry row
# also lists media-clock + plugin-api; this card's v0 surface needs
# media-types only (mixer-format f32 carries no clock vocabulary;
# media-clock joins with the drift micro-resampler, doc 03 §4.8 e;
# the AudioFilter seam joins with the filter-chain card) — the
# manifest is an allowlist, video-engine/codecs precedent: add the
# edges when the cards that need them land. Std-only by C5.
[crates.audio-engine]
layer = 3
internal_deps = ["media-types", "media-clock"]
dev_deps = ["testkit"]
external_allowlist = []
external_dev_allowlist = []

# L4 — audio output backends (doc 01 §2.6 registry row, card 2.C3;
# doc 03 §4.9). The AudioBackend adapter trait (extends
# audio-engine's AudioSink with enumerate/open/pause/resume + the
# sample counter), the wait-free SPSC ring + real-time render
# callback under the no-blocking contract, underrun accounting, the
# null backend and typed OS-backend stubs (real backends land in
# platform-* per doc 01 §2.7 behind ADR-005 — cpal P0 record:
# docs/dependencies/records/cpal-0.18.2.md). REGISTRY DELTA (Lead
# flag, worklog 2.C3): the row lists media-types + audio-engine;
# this card adds the media-clock edge the row under-specifies — the
# device sample counter IS the clock's truth source (doc 03 §4.7/
# §4.9, SampleCounterSource implemented by the open session). Edges
# point downward: L4 → L3 (audio-engine) → L0; L4 → L2 (media-clock)
# → L0. Std-only by C5: zero external dependencies, no unsafe.
[crates.audio-output]
layer = 4
internal_deps = ["audio-engine", "media-clock", "media-types"]
dev_deps = ["testkit"]
external_allowlist = []
external_dev_allowlist = []

# L4 — GPU video presentation (doc 01 §2.6 registry row, card 2.D1;
# doc 03 §4.11). The video-output plugin kind: implements video-engine's
# Presenter on the RenderSurface abstraction — measured RGBA8 staging,
# sRGB present, vsync configuration. NOT-YET-IMPORTED DEPENDENCY
# DECISION (worklog 2.D1 + docs/dependencies/allowlist.md §5): the
# crate is named renderer-wgpu per doc 01, but v0 does not import wgpu
# (no GPU stack in the dev sandbox; wgpu-hal's Linux GL graph pulls the
# denied `libloading`; the card's envelope grants media-types +
# video-engine only). v0 ships the Compositor backend seam with the
# software CPU rasterizer linked (the 7.C1 "software present" fallback)
# and every wgpu integration point typed + shape-pinned; the hardware
# backend joins behind the Lead-ratified import (2.D3 / ADR-003).
# ARCH-4: may not depend on codecs/codec-api/demux/input. Std-only by
# C5. dev_deps carries media-clock TEST-ONLY (worklog 2.D1): the
# presenter-seam AC drives the real PresentationScheduler end-to-end,
# whose constructor speaks media-clock's PlaybackClock (L2 — a legal
# downward dev edge; a dev edge cannot leak into the public API,
# ARCH-7). The production dep set stays exactly the registry row.
[crates.renderer-wgpu]
layer = 4
internal_deps = ["media-types", "video-engine"]
dev_deps = ["testkit", "media-clock"]
external_allowlist = []
external_dev_allowlist = []

# L6 — apps/cli (doc 01 §2.8 registry row "apps/cli — command-line
# player and test driver", card 2.D2): the first vertical's headless
# host. Drives the real pipeline through the ONE command layer
# (ARCH-5): commands (catalog + envelopes), playback-engine (the
# poll-driven Engine/Session), media-probe + input + demux (the open
# path), codecs + codec-api (MJPEG/PCM decoders), media-clock +
# audio-engine + audio-output (null device — no audio hardware in this
# sandbox, ADR-005 era), video-engine + renderer-wgpu (software
# compositor — no GPU in this sandbox, worklog 2.D1), settings-schema
# (--help generation per the card), media-types + plugin-api (the L0/L1
# vocabulary those surfaces expose). APP-REGISTRATION NOTE (card 2.D2):
# doc 01 §5.1's manifest covers "workspace structure"; apps are
# workspace members like any crate, so the first app gets the same
# [crates.<package>] entry pattern (layer 6, per the doc 01 registry
# row) — recorded here because no app existed when 1.E1 wrote the
# manifest. Every edge points downward (L6 → L4/L3/L2/L1/L0). The two
# externals are the command layer's own wire family: serde_json (the
# catalog's serde path, doc 05 §5.1 — a hand-rolled JSON format would
# BYPASS the layer, not honor std-only-ness) and toml (the
# settings-schema validator's `config.set-setting` seam — the
# alternative is a second settings definition, doc 01 §2.8 (d)
# "Never"). Both are Lead-admitted via commands/settings-schema's own
# rows; the app adds no new external of its own.
[crates.lumen-cli]
layer = 6
internal_deps = ["audio-engine", "audio-output", "codec-api", "codecs", "commands", "demux", "input", "media-clock", "media-probe", "media-types", "playback-engine", "plugin-api", "renderer-wgpu", "settings-schema", "video-engine"]
dev_deps = ["testkit"]
external_allowlist = ["serde_json", "toml"]
external_dev_allowlist = []

# L6 — the desktop composition-root SKELETON (doc 01 §2.7 apps/desktop
# registry row, "Phase 2 skeleton → Phase 4 product"; card 2.D3, the
# ADR-003 evidence vehicle). v0 is the variant-B frame-streaming
# prototype core: the wire protocol, the Presenter-side canvas bridge,
# the bounded latest-wins mailbox and the command-layer host seam —
# std-only, NO tauri/wry import (the webview host is a typed seam
# pending ADR-004 ratification + a desktop build environment: this
# sandbox has no webkit2gtk-4.1 dev packages and no display —
# docs/dependencies/records/tauri-wry-2.x.md). Edges point downward:
# L6 → L4 (renderer-wgpu, video-engine via its re-exports) → L0;
# L6 → L1 (commands — the host correlation seam); L6 → L0
# (media-types — the frame/error vocabulary the bridge speaks; a
# registry delta the doc 13 Consumes column under-specified, the
# 2.C3 media-clock precedent: recorded here, Lead-flagged in the
# worklog). dev_deps carries
# media-clock TEST-ONLY (the 2.D1 precedent: the pipeline harness
# drives the real PresentationScheduler over a virtual
# Arc<dyn PlaybackClock>; a dev edge cannot leak into the public API,
# ARCH-7).
[crates.desktop]
layer = 6
internal_deps = ["commands", "lumen-cli", "media-types", "renderer-wgpu", "video-engine"]
dev_deps = ["testkit", "media-clock"]
external_allowlist = []
external_dev_allowlist = []

# L6 — apps/control-server (card 7.J1, issue #50; doc 01 §2.8 registry
# row "control-protocol, commands, engine, contracts", the
# [PROPOSAL]-phase app whose implementation ratifies it). The loopback
# control surface host: operator config (control-server.toml) + the
# product-model gate (features.control-server, doc 07 rule F2) + the
# event loop bridging WS <-> the command layer + structured logging.
# Edges point downward: L6 -> L1 (commands — the dispatch vocabulary;
# control-protocol — the wire; product-config — the gate/identity).
# The engine-embedding join is the desktop composition card's; v1
# serves catalog introspection and answers everything else typed
# not-ready. Externals: serde_json (the command layer's own wire
# format) + toml (the operator config file) — both Lead-admitted via
# the crates that own them; the app adds no new external of its own.
[crates.control-server]
layer = 6
internal_deps = ["commands", "control-protocol", "product-config"]
dev_deps = []
external_allowlist = ["serde_json", "toml"]
external_dev_allowlist = []

# tests/integration/first-vertical (package `first-vertical`, card
# 2.E1): the end-to-end integration suite — a TEST-ONLY harness over
# the ASSEMBLED vertical, so it sits outside the L0–L6 layer stack
# (the testkit/xtask precedent: layer-less, and its edges therefore
# carry no layer ordering). Everything it does to the engine goes
# through the ONE command layer: lumen-cli's CliHost +
# lumen_dispatch (ARCH-5) and the commands catalog vocabulary —
# never a direct engine call (the card's own rule). testkit is the
# dev-only assertion vocabulary. Std-only by C5: zero external
# dependencies — the doc 10 §7 evidence artifacts (JSON transcripts,
# the evidence/1 ledger, SHA-256 digests) are emitted by the crate's
# own std-only writers (the 2.A3/2.B5/2.D1 in-repo precedents).
[crates.first-vertical]
internal_deps = ["commands", "lumen-cli"]
dev_deps = ["testkit"]
external_allowlist = []
external_dev_allowlist = []

# dev crate (doc 01 §1.4 "dev" row, §2.8; card 1.C3). Outside the layer
# stack: it may depend on production crates (none yet — add entries in
# the same change when it gains any), and NOTHING may depend on it
# outside [dev-dependencies] ([rules].dev_only, ARCH-7). Std-only (C5).
[crates.testkit]
internal_deps = []
dev_deps = []
external_allowlist = []
external_dev_allowlist = []

# tools/mem-audit (package lumen-mem-audit, card W5-15): measurement
# instrument — counting GlobalAlloc harness for the memory-audit card.
# Dev-tool position: NOTHING may depend on it. unsafe note: the counting
# GlobalAlloc is the instrument's purpose (unsafe impl GlobalAlloc +
# #[global_allocator], safety-commented in-source; ADR ratification is
# the card's recorded handoff). The internal edges are the instrument's
# measurement surface (it links the whole decode stack to count its
